<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>園藝肥料稀釋計算機</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (前端框架) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel (瀏覽器端 JSX 編譯器) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* 移除 Chrome/Safari/Edge 的數字輸入框上下微調箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* 移除 Firefox 的數字輸入框上下微調箭頭 */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 md:bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- React SVG 圖標元件 (取代外部 Lucide-React 套件，保證加載速度與 100% 成功率) ---
        const IconSprout = () => (
            <svg className="w-7 h-7 text-emerald-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 20h10"/><path d="M10 20V12"/><path d="M13 20v-6a4 4 0 0 1 4-4h2"/><path d="M14 12a6 6 0 0 0-6-6H6"/>
            </svg>
        );

        const IconFlaskConical = () => (
            <svg className="mr-2 w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10 2v8L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45L14 10V2z"/><path d="M6 2h12"/><path d="M8.5 12h7"/>
            </svg>
        );

        const IconCalculator = () => (
            <svg className="mr-2 w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
            </svg>
        );

        const IconAlertCircle = () => (
            <svg className="mr-3 flex-shrink-0 mt-0.5 text-red-500 w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12" y1="16" y2="16"/>
            </svg>
        );

        const IconRefreshCw = () => (
            <svg className="text-emerald-50 w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M16 3h5v5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/>
            </svg>
        );

        const IconScale = () => (
            <svg className="mr-1 w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m16 16 3-8 3 8c-.87.6-2.13.6-3 0s-2.13.6-3 0z"/><path d="m2 16 3-8 3 8c-.87.6-2.13.6-3 0s-2.13.6-3 0z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/>
            </svg>
        );

        const IconBeaker = () => (
            <svg className="mr-1 w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/>
            </svg>
        );

        const IconDroplets = () => (
            <svg className="mr-2 text-emerald-400 w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.09 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M17 18.5c1.37 0 2.5-1.14 2.5-2.53 0-.72-.35-1.41-1.07-2-.71-.57-1.34-1.38-1.53-2.28-.19.9-.82 1.71-1.53 2.28-.72.59-1.07 1.28-1.07 2 0 1.39 1.13 2.53 2.53 2.53z"/>
            </svg>
        );

        // --- 修正後的輸入框組件 ---
        const InputGroup = ({ label, value, setter, unit, min = 0, step = 10 }) => (
            <div className="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <span className="text-gray-700 font-medium text-sm md:text-base">{label}</span>
                <div className="flex items-center space-x-2">
                    <input 
                        type="number" 
                        inputMode="decimal"
                        value={value} 
                        onChange={e => setter(e.target.value === '' ? '' : Number(e.target.value))}
                        className="w-20 md:w-24 text-right font-semibold text-lg text-gray-800 bg-gray-50 border-none rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none p-2 transition-shadow"
                        min={min} 
                        step={step}
                    />
                    <span className="text-gray-400 text-sm w-6">{unit}</span>
                </div>
            </div>
        );

        // --- 快速選擇標籤組件 ---
        const QuickChips = ({ options, currentValue, onSelect, colorClass }) => (
            <div className="flex flex-wrap gap-2 mt-2">
                {options.map(opt => {
                    const isActive = currentValue === opt.value;
                    const baseClass = "px-3 py-1.5 text-xs font-medium rounded-full border transition-all duration-200 active:scale-95";
                    const activeColor = colorClass === 'emerald' 
                        ? "bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-500/20" 
                        : "bg-sky-500 text-white border-sky-500 shadow-md shadow-sky-500/20";
                    const inactiveColor = "bg-white text-gray-600 border-gray-200 hover:bg-gray-50";

                    return (
                        <button
                            key={opt.label}
                            onClick={() => onSelect(opt.value)}
                            className={`${baseClass} ${isActive ? activeColor : inactiveColor}`}
                        >
                            {opt.label}
                        </button>
                    );
                })}
            </div>
        );

        // --- 主應用程式 (移除 export default 避免瀏覽器 exports 錯誤) ---
        function App() {
            // 狀態管理
            const [fertType, setFertType] = useState('solid'); // 'solid' | 'liquid'
            const [fertWeight, setFertWeight] = useState(50);
            const [stockVolume, setStockVolume] = useState(1000);
            const [targetDilution, setTargetDilution] = useState(2000);
            const [finalVolume, setFinalVolume] = useState(1000);

            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            // 預設快速選項
            const dilutionOptions = [
                { label: '500倍 (重肥)', value: 500 },
                { label: '1000倍 (一般)', value: 1000 },
                { label: '2000倍 (淡肥)', value: 2000 }
            ];

            const volumeOptions = [
                { label: '500ml 小噴瓶', value: 500 },
                { label: '1000ml 寶特瓶', value: 1000 },
                { label: '2000ml 澆水壺', value: 2000 },
                { label: '5000ml 水桶', value: 5000 }
            ];

            useEffect(() => {
                calculate();
            }, [fertWeight, stockVolume, targetDilution, finalVolume]);

            const calculate = () => {
                if (!fertWeight || !stockVolume || !targetDilution || !finalVolume || 
                    fertWeight <= 0 || stockVolume <= 0 || targetDilution <= 0 || finalVolume <= 0) {
                    setResult(null);
                    setError('');
                    return;
                }

                const stockRatio = stockVolume / fertWeight;

                if (targetDilution < stockRatio) {
                    setError(`無法配製！原液僅 ${stockRatio} 倍，無法調配出更濃的 ${targetDilution} 倍肥料。請增加原液濃度。`);
                    setResult(null);
                    return;
                } else {
                    setError('');
                }

                const extraDilution = targetDilution / stockRatio;
                const requiredStock = finalVolume / extraDilution;
                const requiredWater = finalVolume - requiredStock;

                setResult({
                    stock: requiredStock,
                    water: requiredWater,
                    stockRatio: stockRatio,
                    extraDilution: extraDilution
                });
            };

            const handleReset = () => {
                setFertWeight('');
                setStockVolume('');
                setTargetDilution('');
                setFinalVolume('');
            };

            return (
                <div className="min-h-screen bg-slate-50 md:bg-gray-100 pb-10 font-sans selection:bg-emerald-200">
                    <div className="max-w-md mx-auto bg-slate-50 md:bg-white md:shadow-2xl md:rounded-3xl overflow-hidden md:mt-8 min-h-screen md:min-h-0 relative">
                        
                        {/* App Header */}
                        <div className="bg-gradient-to-r from-emerald-600 to-teal-600 pt-10 pb-8 px-6 text-white rounded-b-[2.5rem] shadow-md relative z-10">
                            <button 
                                onClick={handleReset}
                                className="absolute top-6 right-6 p-2 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-sm transition-colors"
                                title="重新計算"
                            >
                                <IconRefreshCw />
                            </button>
                            
                            <div className="flex items-center justify-center space-x-3 mb-2">
                                <div className="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm shadow-inner">
                                    <IconSprout />
                                </div>
                                <h1 className="text-2xl font-bold tracking-wide">肥料稀釋幫手</h1>
                            </div>
                            <p className="text-center text-emerald-100/90 text-sm font-light">
                                專業版 • 一鍵帶入常用參數
                            </p>
                        </div>

                        <div className="p-5 space-y-6 -mt-4 relative z-0">
                            
                            {/* Card 1: 原液設定 */}
                            <div className="bg-emerald-50/80 p-5 rounded-3xl border border-emerald-100 shadow-sm">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center text-emerald-800">
                                        <IconFlaskConical />
                                        <h2 className="font-bold text-base">1. 我的原液配方</h2>
                                    </div>
                                    {/* 粉狀/液態 切換開關 */}
                                    <div className="flex bg-white rounded-lg p-0.5 shadow-sm border border-emerald-100">
                                        <button 
                                            onClick={() => setFertType('solid')}
                                            className={`px-2 py-1 text-xs rounded-md flex items-center transition-colors ${fertType === 'solid' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-gray-400'}`}
                                        >
                                            <IconScale /> 粉狀
                                        </button>
                                        <button 
                                            onClick={() => setFertType('liquid')}
                                            className={`px-2 py-1 text-xs rounded-md flex items-center transition-colors ${fertType === 'liquid' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-gray-400'}`}
                                        >
                                            <IconBeaker /> 液態
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <InputGroup 
                                        label={fertType === 'solid' ? "肥料粉重量" : "原液/藥劑容量"} 
                                        value={fertWeight} 
                                        setter={setFertWeight} 
                                        unit={fertType === 'solid' ? "g" : "ml"} 
                                        step={10} 
                                    />
                                    <InputGroup 
                                        label="加水配成總量" 
                                        value={stockVolume} 
                                        setter={setStockVolume} 
                                        unit="ml" 
                                        step={100} 
                                    />
                                </div>
                                {result && !error && (
                                    <div className="mt-3 text-right text-xs text-emerald-600/80 font-medium px-2 flex justify-end items-center">
                                        <span className="bg-emerald-100/50 px-2 py-1 rounded-md">
                                            💡 原液濃度：{result.stockRatio} 倍
                                        </span>
                                    </div>
                                )}
                            </div>

                            {/* Card 2: 目標設定 */}
                            <div className="bg-sky-50/80 p-5 rounded-3xl border border-sky-100 shadow-sm">
                                <div className="flex items-center mb-4 text-sky-800">
                                    <IconCalculator />
                                    <h2 className="font-bold text-base">2. 本次澆灌需求</h2>
                                </div>
                                
                                <div className="space-y-5">
                                    <div>
                                        <InputGroup label="目標稀釋倍數" value={targetDilution} setter={setTargetDilution} unit="倍" step={500} />
                                        <QuickChips options={dilutionOptions} currentValue={targetDilution} onSelect={setTargetDilution} colorClass="sky" />
                                    </div>

                                    <div>
                                        <InputGroup label="需要準備多少" value={finalVolume} setter={setFinalVolume} unit="ml" step={500} />
                                        <QuickChips options={volumeOptions} currentValue={finalVolume} onSelect={setFinalVolume} colorClass="sky" />
                                    </div>
                                </div>
                            </div>

                            {/* Error State */}
                            {error && (
                                <div className="bg-red-50 text-red-700 p-4 rounded-2xl flex items-start border border-red-200 shadow-sm animate-pulse">
                                    <IconAlertCircle />
                                    <p className="text-sm font-medium leading-relaxed">{error}</p>
                                </div>
                            )}

                            {/* Final Result Card */}
                            {result && !error && (
                                <div className="bg-gray-900 rounded-[2rem] shadow-xl overflow-hidden mt-2 transform transition-all duration-300 border border-gray-800 relative group">
                                    <div className="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-sky-500/10 opacity-50"></div>
                                    
                                    <div className="bg-gray-800/80 backdrop-blur-sm py-3 px-6 border-b border-gray-700/50 flex items-center justify-between relative z-10">
                                         <div className="flex items-center">
                                             <IconDroplets />
                                             <span className="text-gray-200 font-semibold text-sm">配製比例 (再稀釋 {result.extraDilution} 倍)</span>
                                         </div>
                                    </div>
                                    
                                    <div className="p-6 relative z-10">
                                        {/* 原液量 */}
                                        <div className="flex items-end justify-between mb-6">
                                            <div className="text-gray-400 font-medium bg-gray-800/50 px-3 py-1 rounded-lg">1. 抽出原液</div>
                                            <div className="flex items-baseline">
                                                <span className="text-4xl md:text-5xl font-black text-emerald-400 tracking-tight drop-shadow-md">
                                                    {result.stock < 1 ? result.stock.toPrecision(2) : Math.round(result.stock * 10) / 10}
                                                </span>
                                                <span className="ml-2 text-lg text-emerald-400/60 font-medium">ml</span>
                                            </div>
                                        </div>

                                        {/* 加水 */}
                                        <div className="flex items-end justify-between relative">
                                            {/* Plus Icon Divider */}
                                            <div className="absolute -top-5 left-1/2 -translate-x-1/2 w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center border-4 border-gray-900 shadow-sm">
                                                <span className="text-gray-500 font-bold leading-none -mt-0.5">+</span>
                                            </div>

                                            <div className="text-gray-400 font-medium bg-gray-800/50 px-3 py-1 rounded-lg">2. 加入清水</div>
                                            <div className="flex items-baseline">
                                                <span className="text-4xl md:text-5xl font-black text-sky-400 tracking-tight drop-shadow-md">
                                                    {Math.round(result.water * 10) / 10}
                                                </span>
                                                <span className="ml-2 text-lg text-sky-400/60 font-medium">ml</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        }

        // 渲染 React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
