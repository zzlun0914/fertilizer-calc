<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人數位空間</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 針對觸控螢幕微動效優化，按下去時會有縮放的回饋感 */
        .tap-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tap-card:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-sm">
        
        <!-- Header 頂部迎賓看板 -->
        <header class="bg-slate-900 text-white pt-10 pb-8 px-6 relative overflow-hidden">
            <!-- 裝飾背景 -->
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-emerald-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-blue-500/10 rounded-full blur-2xl"></div>
            
            <div class="relative z-10">
                <h1 class="text-xl font-light tracking-wider text-slate-400">PERSONAL PORTAL</h1>
                <h2 class="text-2xl font-black tracking-widest mt-1">工作與生活儀表板</h2>
                <div class="w-12 h-1 bg-gradient-to-r from-emerald-500 to-blue-500 mt-3 rounded-full"></div>
            </div>
        </header>

        <!-- 區塊一：綠手指生活區 -->
        <section class="px-5 pt-6 space-y-4">
            <div class="flex items-center space-x-2 px-1">
                <span class="text-xl">🌿</span>
                <h2 class="text-sm font-bold text-slate-400 tracking-wider uppercase">綠手指園藝生活區</h2>
            </div>

            <!-- 1. 肥料稀釋計算機 (已啟用) -->
            <a href="./fertilizer/index.html" class="tap-card block bg-white p-5 rounded-3xl border border-slate-200/50 shadow-sm flex items-center justify-between hover:border-emerald-300">
                <div class="flex items-center space-x-4">
                    <div class="bg-emerald-50 p-3 rounded-2xl text-emerald-600">
                        <!-- 計算機圖標 -->
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="16" height="20" x="4" y="2" rx="2"/>
                            <line x1="8" x2="16" y1="6" y2="6"/>
                            <line x1="16" x2="16" y1="14" y2="18"/>
                            <path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">肥料稀釋計算機</h3>
                        <p class="text-xs text-slate-400 mt-0.5">自動計算粉狀/液態肥料原液與加水量</p>
                    </div>
                </div>
                <div class="text-slate-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <!-- 2. 植物澆水日記 (規劃中) -->
            <div class="bg-slate-100 p-5 rounded-3xl border border-slate-200/30 flex items-center justify-between opacity-60">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-200 p-3 rounded-2xl text-slate-400">
                        <!-- 澆水壺圖標 -->
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.09 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-500 text-base">植物照顧日誌</h3>
                        <p class="text-xs text-slate-400 mt-0.5">記錄澆水、施肥與換盆時間 (規劃中)</p>
                    </div>
                </div>
                <span class="text-[10px] font-bold tracking-wider text-slate-400 bg-slate-200 px-2 py-1 rounded-md">SOON</span>
            </div>
        </section>

        <!-- 分割線 -->
        <div class="px-6 my-4">
            <hr class="border-slate-200" />
        </div>

        <!-- 區塊二：台鐵工作區 -->
        <section class="px-5 space-y-4">
            <div class="flex items-center space-x-2 px-1">
                <span class="text-xl">🚂</span>
                <h2 class="text-sm font-bold text-slate-400 tracking-wider uppercase">台鐵專業工作區</h2>
            </div>

            <!-- 1. 台鐵工作區總入口 (已準備，未來可直接點擊進入) -->
            <a href="./tra/index.html" class="tap-card block bg-white p-5 rounded-3xl border border-slate-200/50 shadow-sm flex items-center justify-between hover:border-blue-300">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-50 p-3 rounded-2xl text-blue-600">
                        <!-- 列車圖標 -->
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="16" height="16" x="4" y="2" rx="2"/>
                            <path d="M4 10h16"/>
                            <path d="M12 2v8"/>
                            <path d="M8 18H5"/>
                            <path d="M19 18h-3"/>
                            <path d="M8 22l1.5-3"/>
                            <path d="M16 22l-1.5-3"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">教學模擬工作區</h3>
                        <p class="text-xs text-slate-400 mt-0.5">專門給同事分享的模擬教學與業務連結</p>
                    </div>
                </div>
                <div class="text-slate-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <!-- 2. 模擬教學未來卡片預留 -->
            <div class="bg-slate-100 p-5 rounded-3xl border border-slate-200/30 flex items-center justify-between opacity-60">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-200 p-3 rounded-2xl text-slate-400">
                        <!-- 規章/號誌圖標 -->
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                            <path d="M6 6h10"/>
                            <path d="M6 10h10"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-500 text-base">運轉規章與號誌模擬</h3>
                        <p class="text-xs text-slate-400 mt-0.5">互動式閉塞與號誌顯示教學系統 (規劃中)</p>
                    </div>
                </div>
                <span class="text-[10px] font-bold tracking-wider text-slate-400 bg-slate-200 px-2 py-1 rounded-md">SOON</span>
            </div>
        </section>

        <!-- 頁尾宣告 -->
        <footer class="text-center text-slate-300 text-xs py-10 mt-auto">
            我的個人數位空間 • 專注於園藝生活與鐵路專業
        </footer>

    </div>

</body>
</html>
