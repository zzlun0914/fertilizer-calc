<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵運轉與教學工作區</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        .tap-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tap-card:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans pb-12 selection:bg-blue-800">

    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-slate-950 shadow-2xl relative">
        <!-- 鐵軌意象裝飾背景 -->
        <div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-blue-900/20 to-transparent pointer-events-none"></div>

        <!-- Header 頂部看板 -->
        <header class="pt-12 pb-8 px-6 relative border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600/20 p-2.5 rounded-2xl border border-blue-500/30">
                    <svg class="w-8 h-8 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="16" height="16" x="4" y="2" rx="2"/>
                        <path d="M4 10h16M12 2v8M8 18H5M19 18h-3M8 22l1.5-3M16 22l-1.5-3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-slate-100">運轉教學與模擬系統</h1>
                    <p class="text-xs text-blue-400 mt-0.5 tracking-widest uppercase font-semibold">TRA Training & Simulation</p>
                </div>
            </div>
            <div class="mt-4 bg-slate-900 border border-slate-800 rounded-lg py-1.5 px-3 flex items-center space-x-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] text-slate-400 font-mono">系統運作正常 / 隨時準備運轉</span>
            </div>
        </header>

        <!-- 工具列表 -->
        <main class="flex-1 px-5 pt-6 space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-500 tracking-wider uppercase">模擬與輔助工具</h2>
                <span class="text-[10px] text-slate-500 font-mono">已啟用 1 / 共 3 個項目</span>
            </div>

            <!-- 工具 1：電聯車直流成分與軌道電路干擾模擬 (已啟用，連向剛建好的子資料夾) -->
            <a href="./dc-component/index.html" class="tap-card block bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-sm flex items-center justify-between hover:border-blue-500 transition-colors">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-900/30 p-3 rounded-2xl text-blue-400 border border-blue-500/20">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-100 text-base">電聯車直流成分干擾模擬</h3>
                        <p class="text-xs text-slate-400 mt-0.5">模擬剛性電車線電弧、主變壓器偏壓</p>
                    </div>
                </div>
                <div class="text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <!-- 工具 2：運轉規章速查 (規劃中) -->
            <div class="bg-slate-900/30 p-5 rounded-3xl border border-slate-900 flex items-center justify-between opacity-40">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-800 p-3 rounded-2xl text-slate-400">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                            <path d="M6 6h10M6 10h10"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-500 text-base">運轉規章速查器</h3>
                        <p class="text-xs text-slate-600 mt-0.5">常用運轉規章、行車命令關鍵字檢索</p>
                    </div>
                </div>
                <span class="text-[10px] font-bold tracking-wider text-slate-500 bg-slate-900 px-2 py-1 rounded-md">SOON</span>
            </div>

            <!-- 工具 3：業務與安全規章測驗 (規劃中) -->
            <div class="bg-slate-900/30 p-5 rounded-3xl border border-slate-900 flex items-center justify-between opacity-40">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-800 p-3 rounded-2xl text-slate-400">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM9 12l2 2 4-4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-500 text-base">業務與安全規章測驗</h3>
                        <p class="text-xs text-slate-600 mt-0.5">提供同仁自我練習與模擬答題系統</p>
                    </div>
                </div>
                <span class="text-[10px] font-bold tracking-wider text-slate-500 bg-slate-900 px-2 py-1 rounded-md">SOON</span>
            </div>
        </main>

        <!-- 頁尾宣告 -->
        <footer class="text-center text-slate-600 text-xs py-10 mt-auto border-t border-slate-900 px-6">
            <p>本平台僅供台鐵同仁內部學術與教學交流使用</p>
            <p class="mt-1">非官方正式系統 • 祝 乘務安全 運轉無礙</p>
        </footer>
    </div>

</body>
</html>
