<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵運轉教學與模擬系統</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 精緻微動效：讓手指點擊時有微縮回彈的物理回饋感 */
        .tap-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tap-card:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 font-sans pb-12 selection:bg-blue-800">

    <!-- 全螢幕自適應容器：在手機上滿版，在平板/電腦上維持精緻的寬度並居中 -->
    <div class="max-w-lg mx-auto min-h-screen flex flex-col bg-slate-900/40 shadow-2xl relative border-x border-slate-800/50">
        
        <!-- 頂部裝飾微發光背景 -->
        <div class="absolute inset-x-0 top-0 h-48 bg-gradient-to-b from-blue-600/10 via-blue-500/5 to-transparent pointer-events-none z-0"></div>

        <!-- Header 頂部看板 (專業鐵路行控中心風) -->
        <header class="pt-10 pb-8 px-6 relative border-b border-slate-800/60 z-10">
            <div class="flex items-center space-x-4">
                <div class="bg-blue-500/10 p-3 rounded-2xl border border-blue-500/30 shadow-lg shadow-blue-500/5">
                    <!-- 火車頭 SVG 圖標 -->
                    <svg class="w-8 h-8 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="16" height="16" x="4" y="2" rx="2"/>
                        <path d="M4 10h16"/>
                        <path d="M12 2v8"/>
                        <path d="M8 18H5"/>
                        <path d="M19 18h-3"/>
                        <path d="M8 22l1.5-3"/>
                        <path d="M16 22l-1.5-3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-white">運轉教學與模擬系統</h1>
                    <p class="text-[10px] text-blue-400/90 mt-0.5 tracking-widest uppercase font-mono font-bold">TRA Training & Simulation</p>
                </div>
            </div>
            
            <!-- 行控跑馬燈狀態條 -->
            <div class="mt-5 bg-slate-950/80 border border-slate-800/80 rounded-xl py-2 px-4 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <span class="flex h-2.5 w-2.5 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-[11px] text-slate-300 font-medium">系統即時監測運作中</span>
                </div>
                <span class="text-[10px] text-slate-500 font-mono bg-slate-900 px-2 py-0.5 rounded border border-slate-800/60">ONLINE</span>
            </div>
        </header>

        <!-- 工具列表區 -->
        <main class="flex-1 px-5 pt-6 space-y-5 z-10">
            
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-500 tracking-widest uppercase">模擬與輔助教學工具</h2>
                <span class="text-[10px] text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-full font-mono">2 Active</span>
            </div>

            <!-- 工具 1：電聯車直流成分與軌道電路干擾模擬 -->
            <a href="./dc-component/index.html" class="tap-card block bg-slate-900/60 p-5 rounded-3xl border border-slate-800/80 shadow-md flex items-center justify-between hover:border-blue-500/60 hover:bg-slate-900 transition-all duration-300 group">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-500/10 p-3.5 rounded-2xl text-blue-400 border border-blue-500/20 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-slate-100 text-base group-hover:text-blue-300 transition-colors">直流成分干擾模擬</h3>
                            <span class="text-[9px] font-bold bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">運作中</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">模擬剛性電車線電弧與主變壓器偏壓</p>
                    </div>
                </div>
                <div class="text-slate-600 group-hover:text-blue-400 transition-colors pl-2">
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <!-- 工具 2：VVVF 變頻器原理實驗室 (已啟用) -->
            <a href="./vvvf/index.html" class="tap-card block bg-slate-900/60 p-5 rounded-3xl border border-slate-800/80 shadow-md flex items-center justify-between hover:border-blue-500/60 hover:bg-slate-900 transition-all duration-300 group">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-500/10 p-3.5 rounded-2xl text-blue-400 border border-blue-500/20 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                        <!-- 音波開關圖標 -->
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-slate-100 text-base group-hover:text-blue-300 transition-colors">VVVF 變頻器實驗室</h3>
                            <span class="text-[9px] font-bold bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">運作中</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">馬達磁勵音聲階模擬與 SPWM 波形</p>
                    </div>
                </div>
                <div class="text-slate-600 group-hover:text-blue-400 transition-colors pl-2">
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <!-- 工具 3：業務與安全規章測驗 (規劃中) -->
            <div class="bg-slate-900/20 p-5 rounded-3xl border border-slate-900 flex items-center justify-between opacity-40 select-none">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-800 p-3.5 rounded-2xl text-slate-500 border border-slate-800/40">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                            <path d="m9 12 2 2 4-4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-400 text-base">行車安全規章測驗</h3>
                        <p class="text-xs text-slate-500 mt-1">提供同仁自主安全考科模擬答題</p>
                    </div>
                </div>
                <span class="text-[9px] font-bold tracking-wider text-slate-500 bg-slate-850 px-2 py-1 rounded-md border border-slate-800/40">COMING SOON</span>
            </div>

        </main>

        <!-- 頁尾宣告 (高度專業、不帶有任何回到生活首頁的連結) -->
        <footer class="text-center text-slate-500 text-xs py-10 mt-auto border-t border-slate-800/60 px-6 bg-slate-950/20 z-10">
            <p class="font-medium">本教學平台僅供台鐵同仁內部學術與教學交流使用</p>
            <p class="mt-1.5 text-[10px] text-slate-600 font-mono tracking-widest">TRA High-Voltage traction System simulator</p>
            <p class="mt-1 text-[10px] text-blue-500/70 font-semibold">乘務安全 • 運轉無礙</p>
        </footer>

    </div>

</body>
</html>
