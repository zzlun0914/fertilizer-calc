<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵變更閉塞與號誌故障處置速查系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .tap-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tap-btn:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .pulsing-dot {
            position: relative;
        }
        .pulsing-dot::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* --- 備置內建資料庫：對齊運轉規章 2.8 / 2.0 版 --- */
        const DEFAULT_DB = {
            version: "動力車乘務員運轉標準作業程序第3.1版 (對齊運轉規章上冊2.8/下冊2.0版)",
            updatedAt: "2026-06-08",
            maintainer: "台鐵機務處指導股 (聯絡電話：02-23815226 / 信箱：rs@railway.gov.tw)",
            globalImages: {
                "嚮導通信式（合用）": "",
                "嚮導通信式（不合用）": "",
                "變更複線運轉不變更閉塞": "",
                "通信式": "",
                "鄰線變更通信式 本線變更複線運轉": "",
                "車站本位指令書": "",
                "列車本位指令書": ""
            },
            lines: {
                "縱貫線北段": ["七堵", "汐止", "南港", "松山", "台北", "萬華", "板橋", "樹林", "樹調"],
                "宜蘭線": ["八堵", "暖暖", "四腳亭", "瑞芳", "猴硐", "三貂嶺", "牡丹", "雙溪", "貢寮(不派站長)", "福隆", "石城", "大里", "大溪", "龜山", "外澳", "頭城", "頂埔", "礁溪", "四城", "宜蘭", "二結", "中里", "羅東", "冬山", "新馬", "蘇澳新"]
            },
            stations: {
                "七堵": {
                    "desc": "一等大站。設有複數出發號誌機。",
                    "radioChannel": "第一頻道 (CH1)",
                    "signals": [
                        { "id": "up_1st_dep", "name": "上行第一出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} },
                        { "id": "up_2nd_dep", "name": "上行第二出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "up_home", "name": "上行進站號誌機", "type": "home", "options": ["就地控制新制", "常規手作"], "images": {} }
                    ]
                },
                "南港": {
                    "desc": "上行設有雙出發，下行設有單出發。",
                    "radioChannel": "第一頻道 (CH1)",
                    "signals": [
                        { "id": "up_1st_dep", "name": "上行第一出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} },
                        { "id": "up_2nd_dep", "name": "上行第二出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "down_dep", "name": "下行出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} }
                    ]
                }
            }
        };

        const convertToDirectLink = (url) => {
            if (!url) return '';
            const trimmed = url.trim();
            if (trimmed.includes('drive.google.com')) {
                const match = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://docs.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            return trimmed;
        };

        const IconArrowLeft = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        );

        const IconBookOpen = () => (
            <svg className="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        );

        const IconAlert = () => (
            <svg className="w-5 h-5 text-red-400 animate-pulse" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        );

        // --- 五大情境運轉通告券模擬器 ---
        const TicketVisualDigital = ({ mode, blockNo = "715053-C", startStation = "南港", endStation = "汐止", routeName = "東正線", orderNo = "501", dispatcher = "張三" }) => {
            const [showGuide, setShowGuide] = useState(false);
            const [activeHotspot, setActiveHotspot] = useState(null);

            const hotspots = useMemo(() => {
                if (mode === '嚮導通信式（合用）') {
                    return [
                        { id: 1, top: '2%', left: '80%', label: '1. 日期確認', desc: '核對日期是否為今日，避免誤拿過期或舊有通告券。' },
                        { id: 2, top: '15%', left: '20%', label: '2. 車次確認', desc: '核對填寫的車次是否與當前運轉車次相符。' },
                        { id: 3, top: '15%', left: '85%', label: '3. 站長簽章', desc: '確認發行車站值班站長有親自簽名或蓋章授權。' },
                        { id: 4, top: '38%', left: '50%', label: '4. 閉塞區間與對策', desc: '確認變更區間，並指定施行「嚮導通信式」閉塞。' },
                        { id: 5, top: '48%', left: '75%', label: '5. CTC合用聲明', desc: '核對填寫是否與自動閉塞式或中央控制行車制（CTC）「合用」。' },
                        { id: 6, top: '58%', left: '50%', label: '6. 指定運轉路線', desc: '雙單線或複線變更為單線運轉時，必須指定運轉經由東正線。' },
                        { id: 7, top: '68%', left: '50%', label: '7. 嚮導同乘註記', desc: '核對是否明確註記「同乘嚮導員，攜帶嚮導證」之攜帶品要點。' },
                        { id: 8, top: '80%', left: '50%', label: '8. 行車命令與調度員', desc: `查對備註之行車命令（第 ${orderNo} 號）與調度控制員姓名（${dispatcher}）。` }
                    ];
                } else if (mode === '嚮導通信式（不合用）') {
                    return [
                        { id: 1, top: '2%', left: '80%', label: '1. 日期確認', desc: '核對填發日期是否與當日相符。' },
                        { id: 2, top: '15%', left: '20%', label: '2. 車次確認', desc: '確認授權車次是否與當前本列車一致。' },
                        { id: 3, top: '15%', left: '85%', label: '3. 站長簽章', desc: '值班站長必須簽認蓋章。' },
                        { id: 4, top: '38%', left: '50%', label: '4. 閉塞區間', desc: '變更區間及施行的閉塞方式（嚮導通信式）。' },
                        { id: 5, top: '48%', left: '75%', label: '5. 不合用聲明', desc: '特別條款：核對填寫是否註明與自動閉塞或中央控制行車制「不合用」。' },
                        { id: 6, top: '68%', left: '50%', label: '6. 嚮導同乘註記', desc: '確認明確登載「同乘嚮導員」或「攜帶嚮導證」之攜帶品要點。' },
                        { id: 7, top: '80%', left: '50%', label: '7. 行車命令', desc: `核對並通報行車命令號碼（第 ${orderNo} 號）及調度控制員姓名（${dispatcher}）。` }
                    ];
                } else if (mode === '變更複線運轉不變更閉塞') {
                    return [
                        { id: 1, top: '2%', left: '80%', label: '1. 日期確認', desc: '確認填發之中華民國日期是否與當日日期相符。' },
                        { id: 2, top: '15%', left: '20%', label: '2. 車次確認', desc: '確認車次是否與當前本列車車次完全一致。' },
                        { id: 3, top: '15%', left: '85%', label: '3. 值班站長簽章', desc: '核對填發車站值班站長（或蓋章）是否完整清晰。' },
                        { id: 4, top: '38%', left: '50%', label: '4. 變更區間', desc: '確認發生號誌不良的站間（如：南港 ─ 汐止間變更經由路線）。' },
                        { id: 5, top: '56%', left: '60%', label: '5. 代用手作號誌', desc: '確認已註記「出發號誌機不良，以代用手作號誌代替」。' },
                        { id: 6, top: '65%', left: '50%', label: '6. 行車命令與調度員', desc: `核對並通報行車命令號碼（如第 ${orderNo} 號）及調度控制員姓名（如：${dispatcher}）。` },
                        { id: 7, top: '82%', left: '50%', label: '7. 不變更閉塞聲明', desc: '關鍵條款：必須註明「變更複線運轉，依表示燈能確認，不變更閉塞方式」，ATP 應保持開啟！' }
                    ];
                } else if (mode === '通信式') {
                    return [
                        { id: 1, top: '2%', left: '80%', label: '1. 日期確認', desc: '核對日期是否為今日。' },
                        { id: 2, top: '15%', left: '20%', label: '2. 車次確認', desc: '核對填寫的車次是否與當前運轉車次相符。' },
                        { id: 3, top: '15%', left: '85%', label: '3. 站長簽章', desc: '確認發行車站值班站長有親自簽名或蓋章授權。' },
                        { id: 4, top: '38%', left: '50%', label: '4. 閉塞區間與對策', desc: '確認指定施行「通信式」閉塞。' },
                        { id: 5, top: '48%', left: '75%', label: '5. 與自動閉塞不合用', desc: '核對填寫是否註明與自動閉塞或中央控制行車制「不合用」。' },
                        { id: 6, top: '75%', left: '50%', label: '6. 行車命令與同意閉塞號碼', desc: `查對行車命令號碼（第 ${orderNo} 號）、同意閉塞紀錄表號碼（如：${blockNo}）及調度員姓名（${dispatcher}）。` }
                    ];
                } else if (mode === '鄰線變更通信式 本線變更複線運轉') {
                    return [
                        { id: 1, top: '2%', left: '80%', label: '1. 日期確認', desc: '核對填發日期是否與今日相符。' },
                        { id: 2, top: '15%', left: '20%', label: '2. 車次確認', desc: '確認車次是否一致。' },
                        { id: 3, top: '15%', left: '85%', label: '3. 站長簽章', desc: '核對填發車站值班站長印。' },
                        { id: 4, top: '38%', left: '50%', label: '4. 雙正線變更區間', desc: '核對指定區間鄰線變更為通信式單線運轉，本線變更為複線運轉，依表示燈能確認。' },
                        { id: 5, top: '56%', left: '60%', label: '5. 指定本線運轉與手作號誌', desc: '確認註明本線維持複線運轉、不變更閉塞，且出發號誌機不良以代用手作代替。' },
                        { id: 6, top: '68%', left: '50%', label: '6. ATP 隔離與否聲明', desc: '依調度命令指示：鄰線通信式列車 ATP 需隔離；本線複線運轉列車 ATP 保持開啟。' },
                        { id: 7, top: '80%', left: '50%', label: '7. 行車命令與調度員', desc: `核對行車命令號碼（第 ${orderNo} 號）及調度員姓名（${dispatcher}）。` }
                    ];
                }
                return [];
            }, [mode, orderNo, dispatcher, blockNo]);

            return (
                <div className="space-y-3">
                    <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-slate-400">數位運轉通告券模擬 (規章標準樣式)</span>
                        <button
                            onClick={() => {
                                setShowGuide(!showGuide);
                                setActiveHotspot(null);
                            }}
                            className="tap-btn text-[10px] font-black px-2.5 py-1.5 rounded-lg border border-blue-500/40 text-blue-400 flex items-center gap-1 bg-blue-600/10"
                        >
                            <span>{showGuide ? "📴 關閉核對導讀" : "🔍 啟動防錯核對導讀"}</span>
                            <span className="bg-red-500 w-1.5 h-1.5 rounded-full animate-pulse"></span>
                        </button>
                    </div>

                    <div className="relative overflow-hidden bg-amber-50 dark:bg-amber-100 text-slate-950 p-4 rounded-2xl border-2 border-amber-300 shadow-xl font-serif text-[10px] leading-relaxed">
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.06] select-none text-red-700 font-bold text-5xl border-4 border-red-700 m-8 rounded-full transform -rotate-12">
                            臺灣鐵路
                        </div>

                        <div className="text-center font-bold text-sm border-b border-amber-300 pb-1 mb-2 tracking-widest text-slate-800">臺灣鐵路 運轉通告券</div>
                        
                        <div className="grid grid-cols-2 gap-1 mb-2 border-b border-amber-200 pb-1.5">
                            <div><span className="font-bold border border-slate-400 px-1 mr-1">車次</span> 502 次</div>
                            <div className="text-right"><span className="font-bold border border-slate-400 px-1 mr-1">日期</span> 115 年 6 月 6 日</div>
                        </div>

                        <table className="w-full border-collapse border border-slate-400 text-[9px] text-center">
                            <tbody>
                                <tr>
                                    <td className="border border-slate-400 font-bold p-1 bg-amber-100/60 w-1/5">種 別</td>
                                    <td className="border border-slate-400 p-1 font-bold text-red-700">
                                        {mode.includes('複線運轉') ? '變更複線運轉 / 路線' : '變更閉塞 / 運轉路線'}
                                    </td>
                                </tr>
                                <tr>
                                    <td className="border border-slate-400 p-1 bg-amber-100/60 font-bold">閉塞區間</td>
                                    <td className="border border-slate-400 p-1 font-bold">{startStation} ── {endStation} 站間</td>
                                </tr>
                                <tr>
                                    <td className="border border-slate-400 p-1 bg-amber-100/60 font-bold">變更閉塞方式</td>
                                    <td className="border border-slate-400 p-1 text-slate-800 font-black">
                                        {mode === '變更複線運轉不變更閉塞' ? '不變更閉塞 (自動閉塞式)' : `${mode} 閉塞式`}
                                    </td>
                                </tr>
                                <tr>
                                    <td className="border border-slate-400 p-1 bg-amber-100/60 font-bold">合用與否</td>
                                    <td className="border border-slate-400 p-1 font-bold">
                                        {mode.includes('合用）') ? '與自動閉塞式或CTC【合用】' : '與自動閉塞或中央控制【不合用】'}
                                    </td>
                                </tr>
                                <tr>
                                    <td className="border border-slate-400 p-1 bg-amber-100/60 font-bold">經由路線</td>
                                    <td className="border border-slate-400 p-1 font-bold text-red-600 underline">{routeName}</td>
                                </tr>
                                <tr>
                                    <td className="border border-slate-400 p-1 bg-amber-100/60 font-bold">備 註</td>
                                    <td className="border border-slate-400 p-1 text-left space-y-1 p-1.5 font-mono text-[8px] leading-normal bg-white/40">
                                        {mode === '變更複線運轉不變更閉塞' ? (
                                            <>
                                                <div>1. 行車命令第 {orderNo} 號，調度員 {dispatcher}。</div>
                                                <div>2. 出發號誌不良，以代用手作號誌代替。</div>
                                                <div className="font-bold text-red-700">3. 變更複線運轉，依表示燈能確認，不變更閉塞方式。</div>
                                            </>
                                        ) : mode === '鄰線變更通信式 本線變更複線運轉' ? (
                                            <>
                                                <div>1. 行車命令第 {orderNo} 號，調度員 {dispatcher}。</div>
                                                <div className="font-bold text-red-700">2. 鄰線通信式，本線維持複線運轉，不變更閉塞，代用手作代替。</div>
                                                <div>3. 出發/進站轉轍器鎖固無誤，速限25km/h。</div>
                                            </>
                                        ) : (
                                            <>
                                                <div>1. 行車命令第 {orderNo} 號，調度員 {dispatcher}。</div>
                                                <div className="font-bold text-red-700">2. 同乘嚮導員，攜帶嚮導證，確認行駛{routeName}。</div>
                                                <div>3. 同意閉塞紀錄表號碼：{blockNo}。</div>
                                            </>
                                        )}
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div className="pt-2 flex justify-between text-[8px] text-slate-500 font-mono">
                            <span>填發者：{startStation} 站長</span>
                            <span className="font-bold border-b border-dashed border-slate-400 font-sans">值班站長簽章：【李四】印</span>
                        </div>

                        {showGuide && hotspots.map(spot => {
                            const isActive = activeHotspot && activeHotspot.id === spot.id;
                            return (
                                <button
                                    key={spot.id}
                                    onClick={() => setActiveHotspot(spot)}
                                    style={{ top: spot.top, left: spot.left }}
                                    className={`absolute w-5 h-5 rounded-full text-[9px] font-black flex items-center justify-center z-20 transition-all pulsing-dot ${
                                        isActive 
                                        ? 'bg-red-600 text-white scale-110 shadow-lg shadow-red-500/50' 
                                        : 'bg-red-500/80 text-white hover:scale-105'
                                    }`}
                                >
                                    {spot.id}
                                </button>
                            );
                        })}
                    </div>

                    {showGuide && (
                        <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl animate-in slide-in-from-top duration-200">
                            {activeHotspot ? (
                                <div className="space-y-1">
                                    <div className="flex items-center space-x-2">
                                        <span className="bg-red-500/10 text-red-400 font-mono font-black text-xs px-2 py-0.5 rounded border border-red-500/20">
                                            要點 {activeHotspot.id}
                                        </span>
                                        <span className="font-bold text-xs text-white">{activeHotspot.label}</span>
                                    </div>
                                    <p className="text-[11px] text-slate-300 leading-relaxed font-mono">
                                        {activeHotspot.desc}
                                    </p>
                                </div>

                                {Object.keys(db.lines).map(line => (
                                    <button
                                        key={line}
                                        onClick={() => {
                                            setSelectedLine(line);
                                            setSelectedStation('');
                                            setSelectedSignal(null);
                                            setSelectedOption('');
                                        }}
                                        className={`py-2 px-2.5 rounded-2xl text-xs font-bold transition-all tap-btn border ${selectedLine === line ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-md' : 'bg-slate-900 border-slate-850 text-slate-400 hover:text-slate-200'}`}
                                    >
                                        {line}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* STEP 2: 選擇車站 */}
                        {selectedLine && (
                            <div className="bg-slate-900/60 p-4 rounded-3xl border border-slate-850/80 shadow-md space-y-3 animate-in fade-in duration-200">
                                <label className="text-xs font-black text-slate-400 tracking-wider block uppercase">步驟 2：選擇目前所在車站</label>
                                <div className="grid grid-cols-3 gap-2 max-h-44 overflow-y-auto no-scrollbar">
                                    {db.lines[selectedLine] && db.lines[selectedLine].map(station => (
                                        <button
                                            key={station}
                                            onClick={() => {
                                                setSelectedStation(station);
                                                setSelectedSignal(null);
                                                setSelectedOption('');
                                            }}
                                            className={`py-2 px-1 rounded-xl text-xs font-bold transition-all tap-btn border ${selectedStation === station ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-md' : 'bg-slate-900 border-slate-850 text-slate-400 hover:text-slate-200'}`}
                                        >
                                            {station}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* STEP 3: 選擇故障號誌 */}
                        {selectedStation && (
                            <div className="bg-slate-900/60 p-4 rounded-3xl border border-slate-850/80 shadow-md space-y-3 animate-in fade-in duration-200">
                                <label className="text-xs font-black text-slate-400 tracking-wider block uppercase">步驟 3：選擇故障之號誌機</label>
                                
                                {/* 2.8版調度無線電頻道指示 */}
                                <div className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-850 flex justify-between items-center text-[10px]">
                                    <span className="text-slate-500 font-bold font-mono uppercase">📡 本站調度無線電頻道：</span>
                                    <span className="bg-blue-600/10 text-blue-400 font-black px-2 py-0.5 rounded border border-blue-500/20 font-mono">
                                        {stationMeta.radioChannel || "第一頻道 (CH1)"}
                                    </span>
                                </div>

                                <div className="grid grid-cols-1 gap-2">
                                    {stationMeta.signals && stationMeta.signals.length > 0 ? (
                                        stationMeta.signals.map(sig => (
                                            <button
                                                key={sig.id}
                                                onClick={() => {
                                                    setSelectedSignal(sig);
                                                    setSelectedOption('');
                                                }}
                                                className={`py-3 px-4 rounded-2xl text-xs font-bold transition-all tap-btn border text-left flex justify-between items-center ${selectedSignal && selectedSignal.id === sig.id ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-md' : 'bg-slate-900 border-slate-850 text-slate-400 hover:text-slate-200'}`}
                                            >
                                                <span>{sig.name}</span>
                                                <span className={`text-[8px] px-1.5 py-0.5 rounded font-black font-mono border ${sig.type === 'home' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}`}>
                                                    {sig.type === 'home' ? '進站號誌' : '出發號誌'}
                                                </span>
                                            </button>
                                        ))
                                    ) : (
                                        <div className="text-xs text-slate-500 text-center py-2">目前後台未配置此車站號誌數據，請前往後台設定。</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* STEP 4：選擇調度變更對策 */}
                        {selectedSignal && selectedSignal.options && selectedSignal.options.length > 0 && (
                            <div className="bg-slate-900/60 p-4 rounded-3xl border border-slate-850/80 shadow-md space-y-3 animate-in fade-in duration-200">
                                <label className="text-xs font-black text-slate-400 tracking-wider block uppercase">步驟 4：選擇調度授權之處置方式</label>
                                <div className="grid grid-cols-2 gap-2.5">
                                    {selectedSignal.options.map(opt => (
                                        <button
                                            key={opt}
                                            onClick={() => setSelectedOption(opt)}
                                            className={`py-3 px-3 rounded-2xl text-xs font-bold transition-all tap-btn border ${selectedOption === opt ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-md' : 'bg-slate-900 border-slate-850 text-slate-400 hover:text-slate-200'}`}
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* FINAL OUTPUT: SOP 輸出與憑證雙軌展示區 */}
                        {selectedSignal && (selectedSignal.options.length === 0 || selectedOption) && (
                            <div className="space-y-5 animate-in slide-in-from-bottom duration-300">
                                
                                {/* 標題牌 */}
                                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl flex items-center justify-between">
                                    <div>
                                        <div className="text-[10px] text-slate-500 font-mono">已生成對應運轉規章 SOP</div>
                                        <h2 className="font-extrabold text-base text-white mt-1">
                                            {selectedStation} • {selectedSignal.name}
                                            <span className="text-xs text-blue-400 block mt-1 font-mono">
                                                (當前處置對策：{selectedOption || '常規手作'})
                                            </span>
                                        </h2>
                                        {/* 規章依據顯示 */}
                                        <div className="mt-1.5 text-[9px] text-slate-500 font-bold bg-slate-950 px-2 py-0.5 rounded border border-slate-850 inline-block font-mono">
                                            📜 規章依據：{regulationRef}
                                        </div>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-lg shadow-inner">
                                        <svg className="w-6 h-6 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="16" height="16" x="4" y="2" rx="2"/><path d="M4 10h16M12 2v8M8 18H5M19 18h-3M8 22l1.5-3M16 22l-1.5-3"/></svg>
                                    </div>
                                </div>

                                {/* 憑證圖形雙軌引擎 */}
                                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                                    <DualVoucherEngine 
                                        mode={selectedOption}
                                        blockNo="715053-C"
                                        startStation={selectedStation}
                                        endStation={selectedStation === '南港' ? '汐止' : '鄰站'}
                                        routeName={selectedStation === '南港' ? '東正線' : '指定正線'}
                                        orderNo="501"
                                        dispatcher="張三"
                                        configImageUrl={configuredImageUrl}
                                        defaultType={defaultType}
                                    />
                                </div>

                                {/* ATP 與行車安全防護面板 */}
                                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                                    <h3 className="text-xs font-black text-slate-500 tracking-wider uppercase">安全與 ATP 防護設定</h3>
                                    
                                    {/* ATP 狀態與隔離限速膠囊 */}
                                    <div className="space-y-2">
                                        <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-950/60 border border-slate-850">
                                            <span className="text-xs font-bold text-slate-400">車載 ATP 行車防護切換</span>
                                            {isAtpIsolated ? (
                                                <span className="text-xs font-black bg-red-500/15 text-red-400 border border-red-500/30 px-3 py-1 rounded-full animate-pulse flex items-center gap-1">
                                                    🔴 ATP 隔離 (切斷關閉)
                                                </span>
                                            ) : (
                                                <span className="text-xs font-black bg-yellow-500/15 text-yellow-400 border border-yellow-500/30 px-3 py-1 rounded-full flex items-center gap-1">
                                                    🟡 啟動越過險阻 (不隔離)
                                                </span>
                                            )}
                                        </div>

                                        {/* 2.8版 ATP 隔離限速 */}
                                        {isAtpIsolated && (
                                            <div className="flex items-center justify-between p-3 rounded-2xl bg-red-950/20 border border-red-900/30">
                                                <span className="text-xs font-bold text-red-400 font-mono">⚠️ 隔離後最大限制速度：</span>
                                                <span className="text-xs font-black bg-red-600 text-white px-3 py-1 rounded-full">
                                                    MAX 60 km/h
                                                </span>
                                            </div>
                                        )}
                                    </div>

                                    {/* 速度限制膠囊 */}
                                    <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-950/60 border border-slate-850">
                                        <span className="text-xs font-bold text-slate-400">通過分歧轉轍器限速</span>
                                        <span className="text-sm font-black text-red-400 font-mono bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">
                                            MAX 25 km/h
                                        </span>
                                    </div>
                                </div>

                                {/* SOP 步驟清單 */}
                                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-3.5">
                                    <h3 className="text-xs font-black text-slate-500 tracking-wider uppercase flex items-center gap-1.5 font-mono">
                                        <IconBookOpen /> 司機員開車/運轉前 SOP 檢核
                                    </h3>
                                    
                                    <div className="space-y-3.5 text-xs text-slate-300 leading-relaxed font-mono">
                                        {selectedOption === '通信式' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>值班站長必須派員交付運轉通告券，確認已填寫「同意閉塞紀錄表號碼」且無任何縮改。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>站方顯示「代用手作出發號誌（綠旗/綠燈）」，出發比照注意信號條件行駛。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>通過分歧轉轍器速度不得超過 25 公里，如無法確認進路開通正確，必須立即停車！</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">04.</span><p>關閉車載 ATP 運轉，並切換限速備援系統。此時運轉最大限制速度為 60km/h。抵達前方站內後始得重開 ATP。</p></div>
                                            </>
                                        )}
                                        
                                        {selectedOption === '變更複線運轉不變更閉塞' && (
                                            <>
                                                <div className="flex items-start gap-2.5 bg-emerald-950/20 p-2.5 rounded-xl border border-emerald-900/40"><span className="text-emerald-400 font-bold">★優</span><p className="text-emerald-300 font-bold">本站具備複線運轉開關！故不變更閉塞方式（按原自動閉塞），ATP 無需關閉隔離。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>確認收到站方交付之運轉通告券，項目確認為「不變更閉塞方式」。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>車載 ATP 無需隔離，按壓面板上之「啟動越過險阻」越過出發地上感應子。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>站方顯示「代用手作出發號誌」，列車出發比照注意信號，轉轍器限速 25km/h 通過。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '路牌' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>必須確實核對實體路牌，確認其形狀為「圓形」，且上端刻有指定區段字樣。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>站方顯示「代用手作號誌」開車，關閉車載 ATP 隔離，分歧轉轍器限速 25km/h。隔離後最高速限 60km/h。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>抵達前方聯絡站後，必須立即停車並交付路牌，重啟車載 ATP。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '嚮導' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>核對實體「嚮導證」，確認區間與車次，並確認嚮導員確實戴著紅底「嚮導員」臂章。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>嚮導員必須親自上車同行，車載 ATP 不必隔離，按壓「啟動越過險阻」後以注意信號限制運轉。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>列車限速 25km/h 通過分歧轉轍器，抵達目的地後交付嚮導證。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '嚮導通信式(單線)' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>確認查對嚮導證無誤。依規章規定，此為不合用狀態，**嚮導員無需上車同行**。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>必須關閉車載 ATP 進行隔離，列車比照通信式注意信號行駛，轉轍器速限 25km/h，ATP隔離最大限制速度為 60km/h。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '就地控制新制' && (
                                            <>
                                                <div className="flex items-start gap-2.5 bg-emerald-950/20 p-2.5 rounded-xl border border-emerald-900/40"><span className="text-emerald-400 font-bold">★新</span><p className="text-emerald-300 font-bold">依 3.1 版 1-1-3 條新制規定：本站已改為「就地控制站」，故無需接受調度行車命令或指令書！</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>機外停車後，以無線電與現場值班站長確認進路與轉轍器開通方向正確。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>車載 ATP 無需隔離，按壓面板之「啟動越過險阻」越過 ATS 感應子。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>確認手作進站號誌（綠旗/綠燈）顯示後，限速 25km/h 穩定進站停車辦客。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '常規手作' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>列車先於 ATS 機外停車。以無線電通報值班站長，確認進站進路開通妥善。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>司機員確認站方派員顯示「代用手作進站號誌（綠旗/綠燈）」後始得開車。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">03.</span><p>ATP 免隔離，按壓「啟動越過險阻」進站.分歧轉轍器限速 25km/h 通過。</p></div>
                                            </>
                                        )}
                                        
                                        {selectedOption === '嚮導通信式（合用）' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>值班站長交付運轉通告券，確認已填寫「同意閉塞紀錄表號碼」，且核對與自動閉塞式或中央控制行車制（CTC）「合用」。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>確認嚮導證區間、日期、車次妥當。**嚮導員必須親自上車同行**。車載 ATP 不用關閉隔離。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '嚮導通信式（不合用）' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>值班站長交付運轉通告券，項目填寫為「不合用」。必須**關閉車載 ATP 隔離（限速 60km/h）**。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>核對並確認嚮導同乘。本線以注意信號限制運轉（25km/h），抵達前方站後重開 ATP。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '鄰線變更通信式 本線變更複線運轉' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>此為雙正線不對稱調度。核對本線變更為複線運轉、不變更閉塞；鄰線變更為通信式單線運轉。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>本線列車車載 ATP 無需隔離，按壓「啟動越過險阻」出發，轉轍器限速 25km/h 通過。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '車站本位指令書' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>機外停車。司機員攜帶無線電行調與本站值班站長核對手作號誌及指令書內容。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>確認股道及轉轍器開通並完成人工防護鎖固後，抄寫指令，關閉車載 ATP（速限 60km/h）進站。</p></div>
                                            </>
                                        )}

                                        {selectedOption === '列車本位指令書' && (
                                            <>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">01.</span><p>南迴線特定區間故障改列車本位。司機員於機車上，透過行調無線電直接與線上調度控制員三讀通話抄錄行車指令書。</p></div>
                                                <div className="flex items-start gap-2.5"><span className="text-blue-400 font-bold">02.</span><p>完成口頭三讀複誦確認。隔離車載 ATP 運轉，最大速限為 60km/h，轉轍器速限 25km/h。</p></div>
                                            </>
                                        )}
                                    </div>
                                </div>

                                {/* 警告標語 */}
                                <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-3xl flex items-start gap-3">
                                    <IconAlert />
                                    <div className="text-xs text-red-300 leading-relaxed font-mono">
                                        <strong className="block text-red-400 mb-0.5">⚠️ 轉轍器進路安全防範</strong>
                                        通過 any 分歧轉轍器時，若前輪有轉向異常或無法由表示燈/手作確認開通方向，司機員必須「立即停車確認」！
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* 頁尾 */}
                    <footer className="text-center text-slate-500 text-[10px] py-8 border-t border-slate-900 max-w-md mx-auto px-6">
                        <p>本教材大數據提取自 115 年度最新台鐵動力車乘務員標準作業程序</p>
                        <p className="mt-1 font-mono uppercase">TRA Block Change Operating Decision Tree</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
