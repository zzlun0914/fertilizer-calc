<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵變更閉塞配置管理後台</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for live JSX translation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .tap-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tap-btn:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_DB = {
            version: "動力車乘務員運轉標準作業程序第3.1版 (對齊運轉規章上冊2.8/下冊2.0版)",
            updatedAt: "2026-06-08",
            maintainer: "花蓮機務段指導股 (聯絡電話：03-8561234 #567 / Email: hl-depot@railway.gov.tw / Line: @hl_tra)",
            globalImages: {
                "嚮導通信式（合用）": "",
                "嚮導通信式（不合用）": "",
                "變更複線運轉不變更閉塞": "",
                "通信式": "",
                "鄰線變更通信式 本線變更複線運轉": "",
                "車站本位指令書": "",
                "列車本位指令書": ""
            },
            lines: {
                "縱貫線北段": ["七堵", "汐止", "南港", "松山", "台北", "萬華", "板橋", "樹林", "樹調"],
                "宜蘭線": ["八堵", "暖暖", "四腳亭", "瑞芳", "猴硐", "三貂嶺", "牡丹", "雙溪", "貢寮(不派站長)", "福隆", "石城", "大里", "大溪", "龜山", "外澳", "頭城", "頂埔", "礁溪", "四城", "宜蘭", "二結", "中里", "羅東", "冬山", "新馬", "蘇澳新"]
            },
            stations: {
                "七堵": {
                    "desc": "一等大站。設有複數出發號誌機。",
                    "radioChannel": "第一頻道 (CH1)",
                    "signals": [
                        { "id": "up_1st_dep", "name": "上行第一出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} },
                        { "id": "up_2nd_dep", "name": "上行第二出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "up_home", "name": "上行進站號誌機", "type": "home", "options": ["就地控制新制", "常規手作"], "images": {} }
                    ]
                },
                "南港": {
                    "desc": "上行設有雙出發，下行設有單出發。",
                    "radioChannel": "第一頻道 (CH1)",
                    "signals": [
                        { "id": "up_1st_dep", "name": "上行第一出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} },
                        { "id": "up_2nd_dep", "name": "上行第二出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "down_dep", "name": "下行出發號誌機", "type": "departure", "options": ["變更複線運轉不變更閉塞", "通信式"], "images": {} }
                    ]
                }
            }
        };

        const AVAILABLE_OPTIONS = [
            "嚮導通信式（合用）", 
            "嚮導通信式（不合用）", 
            "變更複線運轉不變更閉塞", 
            "通信式", 
            "鄰線變更通信式 本線變更複線運轉",
            "車站本位指令書", 
            "列車本位指令書",
            "路牌", 
            "嚮導", 
            "常規手作", 
            "就地控制新制"
        ];

        const RADIO_CHANNEL_OPTIONS = [
            "第一頻道 (CH1)", "花港特定頻道 (CH2)", "調車專用頻道 (CH4)"
        ];

        function App() {
            const [db, setDb] = useState(DEFAULT_DB);
            const [activeLine, setActiveLine] = useState('');
            
            // Modal 控制
            const [showRouteModal, setShowRouteModal] = useState(false);
            const [newRouteName, setNewRouteName] = useState('');
            
            const [showStationModal, setShowStationModal] = useState(false);
            const [editingStation, setEditingStation] = useState(null); 
            const [stationInputName, setStationInputName] = useState(''); 
            const [stationDesc, setStationDesc] = useState('');
            const [stationRadioChannel, setStationRadioChannel] = useState('第一頻道 (CH1)');
            const [stationSignals, setStationSignals] = useState([]); 

            // 🌟 編輯器說明書、剪貼簿與貼上狀態
            const [showInstructions, setShowInstructions] = useState(false); // 🌟 操作說明彈窗
            const [copiedRoute, setCopiedRoute] = useState(null); 
            const [copiedStation, setCopiedStation] = useState(null); 

            // 貼上命名 Modal 狀態
            const [showPasteRouteModal, setShowPasteRouteModal] = useState(false);
            const [pasteRouteName, setPasteRouteName] = useState('');
            const [showPasteStationModal, setShowPasteStationModal] = useState(false);
            const [pasteStationName, setPasteStationName] = useState('');

            // 自製安全防墜確認對話框 State
            const [confirmModal, setConfirmModal] = useState({
                show: false,
                title: '',
                message: '',
                onConfirm: null
            });

            // 載入外部 data.json 檔案
            useEffect(() => {
                fetch('data.json')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.lines && data.stations) {
                            const sanitized = {
                                ...data,
                                maintainer: data.maintainer || DEFAULT_DB.maintainer,
                                globalImages: data.globalImages || DEFAULT_DB.globalImages
                            };
                            setDb(sanitized);
                            const firstLine = Object.keys(data.lines)[0];
                            if (firstLine) setActiveLine(firstLine);
                        }
                    })
                    .catch(() => {
                        const firstLine = Object.keys(DEFAULT_DB.lines)[0];
                        if (firstLine) setActiveLine(firstLine);
                    });
            }, []);

            // 匯入 JSON
            const handleJsonImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (importedData.lines && importedData.stations) {
                            const sanitized = {
                                ...importedData,
                                maintainer: importedData.maintainer || DEFAULT_DB.maintainer,
                                globalImages: importedData.globalImages || DEFAULT_DB.globalImages
                            };
                            setDb(sanitized);
                            const firstLine = Object.keys(importedData.lines)[0];
                            if (firstLine) setActiveLine(firstLine);
                        }
                    } catch (err) {
                        alert("匯入失敗，請確認是否為符合 data.json 格式之檔案。");
                    }
                };
                reader.readAsText(file);
            };

            // 匯出 JSON
            const handleJsonExport = () => {
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // 新增路線
            const addRoute = () => {
                if (!newRouteName.trim()) return;
                if (db.lines[newRouteName]) {
                    alert("此路線區間已存在！");
                    return;
                }
                setDb(prev => ({
                    ...prev,
                    lines: {
                        ...prev.lines,
                        [newRouteName]: []
                    }
                }));
                setActiveLine(newRouteName);
                setNewRouteName('');
                setShowRouteModal(false);
            };

            // 複製路線
            const copyRoute = (lineName) => {
                const stationsList = db.lines[lineName] || [];
                const meta = {};
                stationsList.forEach(st => {
                    meta[st] = JSON.parse(JSON.stringify(db.stations[st] || { desc: '', radioChannel: '第一頻道 (CH1)', signals: [] }));
                });
                setCopiedRoute({
                    name: lineName,
                    stations: stationsList,
                    stationMetadata: meta
                });
            };

            // 貼上路線
            const pasteRoute = () => {
                if (!copiedRoute || !pasteRouteName.trim()) return;
                const newName = pasteRouteName.trim();
                if (db.lines[newName]) {
                    alert("命名衝突！此路線名稱已存在！");
                    return;
                }

                setDb(prev => {
                    const newLines = { ...prev.lines, [newName]: [...copiedRoute.stations] };
                    const newStations = { ...prev.stations };
                    
                    Object.keys(copiedRoute.stationMetadata).forEach(stKey => {
                        newStations[stKey] = JSON.parse(JSON.stringify(copiedRoute.stationMetadata[stKey]));
                    });

                    return {
                        ...prev,
                        lines: newLines,
                        stations: newStations
                    };
                });

                setActiveLine(newName);
                setPasteRouteName('');
                setShowPasteRouteModal(false);
            };

            // 複製車站
            const copyStation = (stName) => {
                const data = db.stations[stName] || { desc: '', radioChannel: '第一頻道 (CH1)', signals: [] };
                setCopiedStation({
                    name: stName,
                    data: JSON.parse(JSON.stringify(data))
                });
            };

            // 貼上車站
            const pasteStation = () => {
                if (!copiedStation || !pasteStationName.trim()) return;
                const newName = pasteStationName.trim();
                if (db.lines[activeLine].includes(newName)) {
                    alert("貼上衝突！此路線下已存在同名車站！");
                    return;
                }

                setDb(prev => {
                    const newLines = {
                        ...prev.lines,
                        [activeLine]: [...prev.lines[activeLine], newName]
                    };
                    const newStations = {
                        ...prev.stations,
                        [newName]: JSON.parse(JSON.stringify(copiedStation.data))
                    };
                    return {
                        ...prev,
                        lines: newLines,
                        stations: newStations
                    };
                });

                setPasteStationName('');
                setShowPasteStationModal(false);
            };

            // 刪除路線
            const deleteRoute = (lineName) => {
                setConfirmModal({
                    show: true,
                    title: "確認刪除整條路線",
                    message: `確定要刪除「${lineName}」路線區間，以及其項下所有車站數據嗎？此處置無法復原。`,
                    onConfirm: () => {
                        setDb(prev => {
                            const newLines = { ...prev.lines };
                            const lineStations = prev.lines[lineName] || [];
                            delete newLines[lineName];
                            
                            const updatedStations = { ...prev.stations };
                            lineStations.forEach(stName => {
                                const isUsedElsewhere = Object.keys(newLines).some(lName => newLines[lName].includes(stName));
                                if (!isUsedElsewhere) {
                                    delete updatedStations[stName];
                                }
                            });

                            const nextLine = Object.keys(newLines)[0] || '';
                            setActiveLine(nextLine);
                            return { ...prev, lines: newLines, stations: updatedStations };
                        });
                        setConfirmModal({ show: false, title: '', message: '', onConfirm: null });
                    }
                });
            };

            // 一鍵清除選定路線下的所有車站 (局部精確清空)
            const clearCurrentLineStations = () => {
                if (!activeLine) return;
                setConfirmModal({
                    show: true,
                    title: "🧹 清空當前路線車站",
                    message: `確認要清空目前選定路線「${activeLine}」下的所有車站嗎？\n系統會自動交叉比對，若清空的車站並未被其他路線引用，才會將其號誌配置在資料庫中抹除，確保共享車站數據不遺失！`,
                    onConfirm: () => {
                        setDb(prev => {
                            const currentStations = prev.lines[activeLine] || [];
                            const updatedLines = {
                                ...prev.lines,
                                [activeLine]: []
                            };

                            const updatedStations = { ...prev.stations };
                            currentStations.forEach(stName => {
                                const usedElsewhere = Object.keys(updatedLines).some(lName => updatedLines[lName].includes(stName));
                                if (!usedElsewhere) {
                                    delete updatedStations[stName];
                                }
                            });

                            return {
                                ...prev,
                                lines: updatedLines,
                                stations: updatedStations
                            };
                        });
                        setConfirmModal({ show: false, title: '', message: '', onConfirm: null });
                    }
                });
            };

            // 打開車站編輯
            const openStationEditor = (stationName = '') => {
                if (stationName) {
                    setEditingStation(stationName);
                    setStationInputName(stationName);
                    const meta = db.stations[stationName] || { desc: '', radioChannel: '第一頻道 (CH1)', signals: [] };
                    setStationDesc(meta.desc || '');
                    setStationRadioChannel(meta.radioChannel || '第一頻道 (CH1)');
                    setStationSignals(meta.signals ? JSON.parse(JSON.stringify(meta.signals)) : []);
                } else {
                    setEditingStation('');
                    setStationInputName('');
                    setStationDesc('');
                    setStationRadioChannel('第一頻道 (CH1)');
                    setStationSignals([
                        { "id": "up_dep", "name": "上行出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "down_dep", "name": "下行出發號誌機", "type": "departure", "options": ["通信式"], "images": {} },
                        { "id": "home", "name": "進站號誌機", "type": "home", "options": ["常規手作"], "images": {} }
                    ]);
                }
                setShowStationModal(true);
            };

            // 儲存車站配置
            const saveStationConfig = () => {
                const finalStationName = stationInputName.trim();
                if (!finalStationName) {
                    alert("請輸入車站名稱！");
                    return;
                }

                if (!editingStation && db.lines[activeLine].includes(finalStationName)) {
                    alert("該線路已有此同名車站！");
                    return;
                }

                setDb(prev => {
                    let updatedLineStations = [...prev.lines[activeLine]];
                    
                    if (editingStation) {
                        if (editingStation !== finalStationName) {
                            updatedLineStations = updatedLineStations.map(s => s === editingStation ? finalStationName : s);
                        }
                    } else {
                        updatedLineStations.push(finalStationName);
                    }

                    const updatedStations = { ...prev.stations };
                    
                    if (editingStation && editingStation !== finalStationName) {
                        const isShared = Object.keys(prev.lines).some(lName => lName !== activeLine && prev.lines[lName].includes(editingStation));
                        if (!isShared) {
                            delete updatedStations[editingStation];
                        }
                    }

                    updatedStations[finalStationName] = {
                        desc: stationDesc,
                        radioChannel: stationRadioChannel,
                        signals: stationSignals
                    };

                    return {
                        ...prev,
                        lines: {
                            ...prev.lines,
                            [activeLine]: updatedLineStations
                        },
                        stations: updatedStations
                    };
                });

                setShowStationModal(false);
                setEditingStation(null);
            };

            // 刪除車站 (引進垃圾回收)
            const deleteStation = (stationName) => {
                setConfirmModal({
                    show: true,
                    title: "確認移除車站",
                    message: `確定要將「${stationName}」車站從「${activeLine}」路線中完全移除嗎？`,
                    onConfirm: () => {
                        setDb(prev => {
                            const updatedLineStations = prev.lines[activeLine].filter(s => s !== stationName);
                            const updatedLines = {
                                ...prev.lines,
                                [activeLine]: updatedLineStations
                            };

                            const updatedStations = { ...prev.stations };
                            const isShared = Object.keys(updatedLines).some(lName => updatedLines[lName].includes(stationName));
                            if (!isShared) {
                                delete updatedStations[stationName];
                            }

                            return {
                                ...prev,
                                lines: updatedLines,
                                stations: updatedStations
                            };
                        });
                        setConfirmModal({ show: false, title: '', message: '', onConfirm: null });
                    }
                });
            };

            // 上下移動車站順序
            const moveStation = (index, direction) => {
                const lineStations = [...db.lines[activeLine]];
                const targetIndex = index + direction;
                
                if (targetIndex < 0 || targetIndex >= lineStations.length) return;
                
                const temp = lineStations[index];
                lineStations[index] = lineStations[targetIndex];
                lineStations[targetIndex] = temp;
                
                setDb(prev => ({
                    ...prev,
                    lines: {
                        ...prev.lines,
                        [activeLine]: lineStations
                    }
                }));
            };

            // 增加號誌槽
            const addNewSignalSlot = () => {
                const newId = `sig_${Date.now()}`;
                setStationSignals(prev => [
                    ...prev,
                    { id: newId, name: "新設號誌機", type: "departure", options: ["通信式"], "images": {} }
                ]);
            };

            // 移除特定號誌槽
            const removeSignalSlot = (id) => {
                setStationSignals(prev => prev.filter(s => s.id !== id));
            };

            // 變更號誌槽欄位
            const updateSignalField = (id, field, value) => {
                setStationSignals(prev => prev.map(s => {
                    if (s.id === id) {
                        return { ...s, [field]: value };
                    }
                    return s;
                }));
            };

            // 勾選/取勾選號誌的適用規章選項
            const toggleOptionCheckbox = (signalId, optionName) => {
                setStationSignals(prev => prev.map(s => {
                    if (s.id === signalId) {
                        const currentOpts = s.options || [];
                        const nextOpts = currentOpts.includes(optionName)
                            ? currentOpts.filter(o => o !== optionName)
                            : [...currentOpts, optionName];
                        
                        const currentImages = s.images || {};
                        const nextImages = { ...currentImages };
                        if (!currentOpts.includes(optionName)) {
                            nextImages[optionName] = ""; 
                        } else {
                            delete nextImages[optionName]; 
                        }

                        return { ...s, options: nextOpts, images: nextImages };
                    }
                    return s;
                }));
            };

            const updateSignalImageValue = (signalId, optionName, value) => {
                setStationSignals(prev => prev.map(s => {
                    if (s.id === signalId) {
                        const nextImages = { ...s.images, [optionName]: value };
                        return { ...s, images: nextImages };
                    }
                    return s;
                }));
            };

            // 全域範本圖片連結設定更新
            const updateGlobalImageValue = (optName, value) => {
                setDb(prev => ({
                    ...prev,
                    globalImages: {
                        ...prev.globalImages,
                        [optName]: value
                    }
                }));
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-900/40 border-x border-slate-800 pb-12 relative">
                    
                    {/* Header */}
                    <header className="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="text-lg">⚙️</span>
                            <div>
                                <h1 className="text-sm font-bold text-white">規章配置管理後台</h1>
                                <p className="text-[9px] text-slate-400 font-mono">TRA Block Config Generator</p>
                            </div>
                        </div>
                        <div className="flex space-x-1.5 items-center">
                            {/* 🌟 核心增修：操作說明按鈕 */}
                            <button
                                onClick={() => setShowInstructions(true)}
                                className="text-xs bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 py-1.5 px-2.5 rounded-lg border border-blue-500/20 font-bold tap-btn"
                            >
                                📖 操作說明
                            </button>
                            <a href="./index.html" className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700">
                                返回查詢端
                            </a>
                        </div>
                    </header>

                    {/* 編輯器剪貼簿動態懸浮狀態列 */}
                    {(copiedRoute || copiedStation) && (
                        <div className="bg-blue-600/10 border-y border-blue-500/30 px-4 py-2 flex items-center justify-between text-[10px] animate-in fade-in duration-150">
                            <div className="flex items-center space-x-2">
                                <span className="bg-blue-500/20 text-blue-400 font-black px-1.5 py-0.5 rounded">📋 剪貼簿</span>
                                <span className="text-slate-300 font-mono">
                                    {copiedRoute && `已複製路線:「${copiedRoute.name}」 `}
                                    {copiedStation && `已複製車站:「${copiedStation.name}」`}
                                </span>
                            </div>
                            <button 
                                onClick={() => { setCopiedRoute(null); setCopiedStation(null); }}
                                className="text-[8px] text-slate-500 hover:text-white"
                            >
                                清除暫存
                            </button>
                        </div>
                    )}

                    <div className="p-4 space-y-5 flex-1">
                        
                        {/* 系統基本規章版本與維護者資訊設定 (🌟已整合維護者輸入欄位) */}
                        <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-850 space-y-3">
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest">系統規章版本與校對</h2>
                            <div className="space-y-2.5">
                                <div>
                                    <label className="text-[10px] text-slate-500 font-mono block mb-1">對應規章版本名稱</label>
                                    <input 
                                        type="text" 
                                        value={db.version}
                                        onChange={(e) => setDb(prev => ({ ...prev, version: e.target.value }))}
                                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-500 font-mono block mb-1">資料最後校對日期</label>
                                    <input 
                                        type="date" 
                                        value={db.updatedAt}
                                        onChange={(e) => setDb(prev => ({ ...prev, updatedAt: e.target.value }))}
                                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500"
                                    />

                                <div className="flex gap-2 text-xs pt-1">
                                    <button onClick={saveStationConfig} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold tap-btn">確認儲存</button>
                                    <button onClick={() => setShowStationModal(false)} className="flex-1 bg-slate-800 text-slate-400 py-2.5 rounded-xl font-bold tap-btn">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🌟 核心增修：📖 後台操作說明彈出視窗 (Modal) */}
                    {showInstructions && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 flex-shrink-0">
                                    <h3 className="text-xs font-black text-blue-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <span>📖 系統後台操作說明與交班手冊</span>
                                    </h3>
                                    <button 
                                        onClick={() => setShowInstructions(false)}
                                        className="text-xs text-slate-400 hover:text-white tap-btn"
                                    >
                                        關閉 ❌
                                    </button>
                                </div>
                                
                                <div className="space-y-4 text-[11px] text-slate-300 overflow-y-auto pr-1 no-scrollbar font-mono leading-relaxed">
                                    <section className="space-y-1.5">
                                        <h4 className="text-white font-bold text-xs">一、路線管理 (第一步)</h4>
                                        <p>1. 點擊 <strong className="text-blue-400">+ 新增線路</strong> 可創立全新的軌道線區。</p>
                                        <p>2. 點擊 <strong className="text-blue-400">📋 複製路線</strong> 即可暫存當前選定的整條線路以及其下所有車站配置。當剪貼簿有資料時，可在別的段別點擊貼上並重新命名，實現秒速跨段複製。</p>
                                    </section>

                                    <section className="space-y-1.5">
                                        <h4 className="text-white font-bold text-xs">二、車站排序與剪貼簿 (第二步)</h4>
                                        <p>1. 點擊車站右側的 <strong className="text-emerald-400">🔺 / 🔻</strong> 按鈕即可上下移動車站的里程位置（北上/南下順序），前台速查介面會同步調整。</p>
                                        <p>2. 點擊車站上的 <strong className="text-emerald-400">📋 (複製)</strong> 圖示，可將該站的不對稱號誌、無線電頻道及自訂憑證圖片完整存入剪貼簿。在建立新站時點貼上，一秒帶入，極致省時。</p>
                                    </section>

                                    <section className="space-y-1.5">
                                        <h4 className="text-white font-bold text-xs">三、雙軌制憑證與全域範本</h4>
                                        <p>1. 為了防範手動逐站填寫連結的繁瑣，請在頂部「全域憑證五大情境」貼上您產生的 7 張憑證圖片網址，全台所有車站便會自動承襲載入。</p>
                                        <p>2. 若特定大站（如南港站）有專屬填發圖片，可在編輯該站號誌時，於下方「特規覆蓋」欄位貼上獨立圖片，系統會優先覆蓋全域載入。</p>
                                        <p>3. 支援將 Google 雲端硬碟的一般共用連結（以 drive.google.com 開頭）直接貼入，前台在載入時會自動轉址直接渲染，防杜瀏覽器破圖。</p>
                                    </section>

                                    <section className="space-y-1.5 bg-red-950/20 p-2.5 rounded-xl border border-red-900/30">
                                        <h4 className="text-red-400 font-bold text-xs">⚠️ 交叉比對垃圾回收機制</h4>
                                        <p>當您執行「刪除單一車站」或「一鍵清空目前路線車站」時，系統會自動在背景掃描。只有在該車站並未被其他路線（如跨線共享車站）引用時，才會抹除其號誌配置元數據，確保跨線路大站數據絕對保全。</p>
                                    </section>
                                </div>

                                <button 
                                    onClick={() => setShowInstructions(false)}
                                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold tap-btn flex-shrink-0"
                                >
                                    我知道了，開始設定
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 安全防護確認 Modal */}
                    {confirmModal.show && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-red-500/30 w-full max-w-xs rounded-2xl p-5 space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-150">
                                <div className="flex items-center space-x-2 text-red-400">
                                    <span className="text-lg">⚠️</span>
                                    <h3 className="text-sm font-black uppercase tracking-widest">{confirmModal.title}</h3>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed font-mono">
                                    {confirmModal.message}
                                </p>
                                <div className="flex gap-2 text-xs">
                                    <button 
                                        onClick={() => {
                                            if (confirmModal.onConfirm) confirmModal.onConfirm();
                                        }} 
                                        className="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold tap-btn"
                                    >
                                        確認
                                    </button>
                                    <button 
                                        onClick={() => setConfirmModal({ show: false, title: '', message: '', onConfirm: null })} 
                                        className="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold tap-btn"
                                    >
                                        取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 頁尾 */}
                    <footer className="text-center text-slate-500 text-[10px] py-6 border-t border-slate-900 max-w-md mx-auto">
                        <p>台鐵行車規章視覺化管理配置系統</p>
                        <p className="mt-1 font-mono uppercase">TRA Block Change Operating Configurator</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
