        // -----------------------------------------------------------------------------
        // Component: Symmetric Adhesion Graph (對稱式 蠕滑/滑走 黏著係數曲線圖組件) - 優化高解析度與對比
        // -----------------------------------------------------------------------------
        const AdhesionGraph = ({ currentSlip, weather }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // 處理 High-DPI (Retina) 螢幕防模糊
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const width = rect.width;
                const height = rect.height;

                // 清除畫布
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#090d16'; // 飽和深海藍黑背景
                ctx.fillRect(0, 0, width, height);

                const p = 35; // 邊距
                const graphW = width - p * 2;
                const graphH = height - p * 2;
                const centerX = p + graphW / 2;

                // 繪製網格
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for (let x = p; x <= width - p; x += graphW / 10) {
                    ctx.beginPath();
                    ctx.moveTo(x, p);
                    ctx.lineTo(x, height - p);
                    ctx.stroke();
                }
                for (let y = p; y <= height - p; y += graphH / 4) {
                    ctx.beginPath();
                    ctx.moveTo(p, y);
                    ctx.lineTo(width - p, y);
                    ctx.stroke();
                }

                // 繪製座標軸 (雙向對稱 X 軸與 Y 軸)
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p, height - p);
                ctx.lineTo(width - p, height - p); // X 軸
                ctx.moveTo(centerX, p);
                ctx.lineTo(centerX, height - p); // Y 軸 (中心零點)
                ctx.stroke();

                // 標籤
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 10px "JetBrains Mono", sans-serif';
                ctx.fillText('黏著係數 (μ)', centerX + 8, p + 10);
                ctx.fillText('← 滑走 (Slide) %  |  空轉 (Slip) % →', p + 12, height - p + 22);

                // 刻度標籤
                ctx.fillText('-50%', p - 5, height - p + 12);
                ctx.fillText('0', centerX - 3, height - p + 12);
                ctx.fillText('+50%', width - p - 20, height - p + 12);
                ctx.fillText('0.4', centerX - 22, p + 8);

                // 根據天氣決定物理參數
                let peakMu = 0.35; // 乾燥
                let peakSlip = 12; // 最佳黏著點 (12%)
                let color = '#3b82f6';

                if (weather === 'wet') {
                    peakMu = 0.15; // 潮濕
                    peakSlip = 10;
                    color = '#0ea5e9';
                } else if (weather === 'ice') {
                    peakMu = 0.06; // 結霜
                    peakSlip = 6;
                    color = '#2dd4bf';
                }

                // 繪製左右對稱的黏著特性曲線 (Pacejka 簡化模型)
                ctx.strokeStyle = color;
                ctx.lineWidth = 3.5;
                ctx.beginPath();

                for (let x = 0; x <= graphW; x += 2) {
                    const slipVal = ((x / graphW) * 100) - 50; 
                    const absSlip = Math.abs(slipVal);
                    let mu = 0;

                    if (absSlip <= peakSlip) {
                        const ratio = absSlip / peakSlip;
                        mu = peakMu * ratio * (2 - ratio);
                    } else {
                        const decay = (absSlip - peakSlip) * 0.07;
                        mu = peakMu * Math.exp(-decay);
                        if (mu < peakMu * 0.25) mu = peakMu * 0.25;
                    }

                    const plotX = p + x;
                    const plotY = (height - p) - (mu / 0.4) * graphH;

                    if (x === 0) ctx.moveTo(plotX, plotY);
                    else ctx.lineTo(plotX, plotY);
                }
                ctx.stroke();

                // 繪製「最佳黏著區」高亮範圍 (左右對稱)
                ctx.fillStyle = 'rgba(16, 185, 129, 0.18)'; // 提高透明度增加對比
                // 右側牽引最佳區
                const rightPeakXStart = centerX + ((peakSlip - 3) / 100) * graphW;
                const peakWidthPx = (6 / 100) * graphW;
                ctx.fillRect(rightPeakXStart, p, peakWidthPx, graphH);
                // 左側制動最佳區
                const leftPeakXStart = centerX - ((peakSlip + 3) / 100) * graphW;
                ctx.fillRect(leftPeakXStart, p, peakWidthPx, graphH);

                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText('最佳黏著區', rightPeakXStart, p - 6);
                ctx.fillText('最佳黏著區', leftPeakXStart, p - 6);

                // 繪製當前狀態點
                const clampedSlip = Math.max(-50, Math.min(currentSlip, 50)); 
                const pointX = centerX + (clampedSlip / 100) * graphW;
                
                const absCurrentSlip = Math.abs(clampedSlip);
                let currentMu = 0;
                if (absCurrentSlip <= peakSlip) {
                    const ratio = absCurrentSlip / peakSlip;
                    currentMu = peakMu * ratio * (2 - ratio);
                } else {
                    const decay = (absCurrentSlip - peakSlip) * 0.07;
                    currentMu = peakMu * Math.exp(-decay);
                    if (currentMu < peakMu * 0.25) currentMu = peakMu * 0.25;
                }
                const pointY = (height - p) - (currentMu / 0.4) * graphH;

                // 狀態點顏色邏輯 (打滑失控顯示紅點)
                const isLosingGrip = absCurrentSlip > peakSlip + 4;
                
                // 外發光光暈
                ctx.shadowColor = isLosingGrip ? '#f43f5e' : '#10b981';
                ctx.shadowBlur = 12;
                ctx.fillStyle = isLosingGrip ? '#f43f5e' : '#10b981';
                ctx.beginPath();
                ctx.arc(pointX, pointY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // 重置外發光

                // 繪製垂直輔助虛線
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(pointX, height - p);
                ctx.lineTo(pointX, pointY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 狀態標籤背景板，提高可視度
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                const stateLabel = clampedSlip >= 0 ? '空轉' : '滑走';
                const textStr = `${stateLabel}: ${clampedSlip.toFixed(1)}%, μ=${currentMu.toFixed(2)}`;
                const textWidth = ctx.measureText(textStr).width;
                
                const boxX = pointX > centerX ? pointX - textWidth - 15 : pointX + 10;
                const boxY = pointY - 20;
                ctx.fillRect(boxX - 4, boxY - 10, textWidth + 8, 16);
                
                ctx.fillStyle = isLosingGrip ? '#fda4af' : '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(textStr, boxX, boxY + 2);

            }, [currentSlip, weather]);

            return (
                <canvas 
                    ref={canvasRef} 
                    className="w-full h-44 sm:h-52 lg:h-[220px] bg-slate-950 rounded-2xl shadow-inner border border-slate-800" 
                />
            );
        };

        // -----------------------------------------------------------------------------
        // Component: Rolling Chart (時間序列圖 - 車速 vs 輪速) - 高畫質自適應
        // -----------------------------------------------------------------------------
        const TimeSeriesChart = ({ dataHistory }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // 處理 High-DPI (Retina)
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const width = rect.width;
                const height = rect.height;

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, width, height);

                // 繪製網格
                ctx.strokeStyle = '#141e30';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let x = 0; x < width; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                for (let y = 0; y < height; y += 30) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
                ctx.stroke();

                if (dataHistory.length < 2) return;

                // 縮放比例
                const maxSpeed = 120; // 最大顯示速度 km/h
                const scaleY = height / maxSpeed;
                const stepX = width / (dataHistory.length - 1);

                // 繪製曲線函數
                const drawLine = (color, valueKey, lineWidth = 2, isDashed = false) => {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = lineWidth;
                    if (isDashed) ctx.setLineDash([4, 4]);
                    else ctx.setLineDash([]);
                    
                    ctx.beginPath();
                    dataHistory.forEach((point, i) => {
                        const x = i * stepX;
                        const y = height - (point[valueKey] * scaleY);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                };

                // 繪製車速 (高對比藍實線)
                drawLine('#3b82f6', 'speed', 3.5, false);
                // 繪製輪速 (亮紅虛線)
                drawLine('#f43f5e', 'wheelSpeed', 2.5, true);
                ctx.setLineDash([]); // 重置

                // 標例文字背景框
                ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                ctx.fillRect(10, 8, 260, 36);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(10, 8, 260, 36);

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 9px "JetBrains Mono", monospace';
                ctx.fillText('實際車速 (Train Speed)', 20, 22);
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(155, 14, 20, 6);

                ctx.fillStyle = '#94a3b8';
                ctx.fillText('車輪轉速 (Wheel Speed)', 20, 34);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(155, 29, 20, 3);

            }, [dataHistory]);

            return <canvas ref={canvasRef} className="w-full h-36 sm:h-44 lg:h-48 bg-slate-950 rounded-xl border border-slate-850" />;
        };

        // -----------------------------------------------------------------------------
        // Component: Physics Logic Hook (列車核心動力學與防滑走/防空轉邏輯)
        // -----------------------------------------------------------------------------
        const useTrainPhysics = () => {
            const [state, setState] = useState({
                mascon: 0,         // -100% (極限制動) ~ +100% (極限牽引)
                speed: 0,          // km/h
                wheelSpeed: 0,     // km/h
                slipRatio: 0,      // % (正值代表空轉，負值代表滑走)
                distance: 0,       // 行駛里程 (公尺)
                sanding: false,    // 是否在撒砂
                sandLevel: 100,    // 砂箱餘量 %
            });

            const [env, setEnv] = useState({
                weather: 'dry',       // dry, wet, ice
                gradient: 0,          // 坡度 %
                controlSystem: true,  // TC & WSP 控制系統開關
                isRunning: false,
            });

            const stateRef = useRef(state);
            const envRef = useRef(env);
            stateRef.current = state;
            envRef.current = env;

            const [history, setHistory] = useState([]);

            useEffect(() => {
                let interval;
                if (env.isRunning) {
                    interval = setInterval(() => {
                        const s = stateRef.current;
                        const e = envRef.current;

                        // --- 列車物理常數 ---
                        const DT = 0.05; // 步進時間 50ms
                        const MASS = 42000; // 單節車重 42 噸
                        const MAX_TRACTIVE_FORCE = 80000; // 牽引力極限 (80 kN)
                        const MAX_BRAKING_FORCE = 75000;  // 煞車制動力極限 (75 kN)
                        
                        // --- 1. 軌道環境基本黏著極限 (Mu) ---
                        let baseMu = 0.33; // 乾燥
                        if (e.weather === 'wet') baseMu = 0.15; // 濕滑
                        if (e.weather === 'ice') baseMu = 0.06; // 極滑

                        // 撒砂補償效果 (消耗沙量增加摩擦)
                        let currentMu = baseMu;
                        let newSandLevel = s.sandLevel;
                        if (s.sanding && s.sandLevel > 0) {
                            currentMu = Math.min(baseMu * 1.5, 0.42); 
                            newSandLevel = Math.max(0, s.sandLevel - 0.4); 
                        }

                        // --- 2. 牽引力與制動力計算 (結合防打滑與 WSP 邏輯) ---
                        let tractionForce = 0;
                        let brakingForce = 0;

                        if (s.mascon > 0) {
                            // 【牽引模式】
                            let effectiveTraction = s.mascon;
                            if (e.controlSystem) {
                               // 牽引防空轉：當車輪加速過快(空轉)，自動斬波調降電門出力
                               if (s.slipRatio > 12) effectiveTraction *= 0.05;
                               else if (s.slipRatio > 4) effectiveTraction *= 0.35;
                            }
                            tractionForce = (effectiveTraction / 100) * MAX_TRACTIVE_FORCE;

                        } else if (s.mascon < 0) {
                            // 【制動模式】
                            let effectiveBrake = Math.abs(s.mascon);
                            if (e.controlSystem) {
                               // WSP 滑走保護：當偵測到車輪即將鎖死，迅速洩壓(釋放煞車)以防擦傷
                               if (s.slipRatio < -12) effectiveBrake *= 0.05; // 完全釋放煞車讓輪速回穩
                               else if (s.slipRatio < -4) effectiveBrake *= 0.4;
                            }
                            brakingForce = (effectiveBrake / 100) * MAX_BRAKING_FORCE;
                        }

                        // --- 3. 動態阻力計算 ---
                        const rollingRes = 1800; // 基本滾動阻力
                        const airDrag = 0.5 * 1.2 * 9.5 * (s.speed / 3.6) ** 2; // 空氣阻力
                        const gradientForce = MASS * 9.81 * (e.gradient / 100); // 坡度阻力

                        const totalResistance = rollingRes + airDrag + gradientForce;

                        // --- 4. 輪軌最大能承受之黏著抓地極限 ---
                        const maxAdhesionForce = currentMu * MASS * 9.81;

                        // --- 5. 輪速與車速的解聯運算 (核心物理模型) ---
                        let newSpeed = s.speed;
                        let newWheelSpeed = s.wheelSpeed;

                        if (tractionForce > 0) {
                            // 【牽引狀態】
                            if (tractionForce > maxAdhesionForce) {
                                // 【空轉 (Slip)】：輸出力量大於摩擦極限，多餘能量使車輪暴轉
                                const excessForce = tractionForce - maxAdhesionForce;
                                const wheelInertia = 1800; 
                                const wheelAccel = (excessForce / wheelInertia) * DT;
                                newWheelSpeed = s.wheelSpeed + (wheelAccel * 3.6); // 轉速暴增

                                // 火車本體僅能依據極限靜摩擦力扣除阻力來加速
                                const netForce = maxAdhesionForce - totalResistance;
                                const trainAccel = (netForce / MASS) * DT;
                                newSpeed = s.speed + (trainAccel * 3.6);
                            } else {
                                // 【黏著良好】
                                if (s.wheelSpeed > s.speed + 0.2) {
                                    // 空轉後重黏著，轉速慢慢回歸車速
                                    newWheelSpeed = s.wheelSpeed * 0.8 + s.speed * 0.2;
                                } else {
                                    newWheelSpeed = newSpeed;
                                }
                                const netForce = tractionForce - totalResistance;
                                const trainAccel = (netForce / MASS) * DT;
                                newSpeed = s.speed + (trainAccel * 3.6);
                            }

                        } else if (brakingForce > 0) {
                            // 【制動狀態】
                            if (brakingForce > maxAdhesionForce) {
                                // 【滑走 (Slide)】：煞車力大於車輪黏著極限，車輪被鎖死不轉
                                const excessBraking = brakingForce - maxAdhesionForce;
                                const wheelInertia = 1800;
                                const wheelDecel = (excessBraking / wheelInertia) * DT;
                                newWheelSpeed = s.wheelSpeed - (wheelDecel * 3.6); // 轉速驟降

                                // 火車本體滑行減速
                                const netDecelForce = maxAdhesionForce + totalResistance;
                                const trainDecel = (netDecelForce / MASS) * DT;
                                newSpeed = s.speed - (trainDecel * 3.6);
                            } else {
                                // 【煞車黏著良好】
                                const netDecelForce = brakingForce + totalResistance;
                                const trainDecel = (netDecelForce / MASS) * DT;
                                newSpeed = s.speed - (trainDecel * 3.6);
                                newWheelSpeed = newSpeed;
                            }

                        } else {
                            // 【惰行 N 檔狀態】
                            const netForce = -totalResistance;
                            const trainAccel = (netForce / MASS) * DT;
                            newSpeed = s.speed + (trainAccel * 3.6);
                            
                            if (s.wheelSpeed !== s.speed) {
                                newWheelSpeed = s.wheelSpeed * 0.8 + s.speed * 0.2;
                            } else {
                                newWheelSpeed = newSpeed;
                            }
                        }

                        // 限幅保護
                        if (newSpeed < 0) {
                            newSpeed = 0;
                            newWheelSpeed = 0;
                        }
                        if (newWheelSpeed < 0) newWheelSpeed = 0;

                        // 當車輛停止時，限制滑動
                        if (newSpeed === 0 && s.mascon <= 0) {
                            newWheelSpeed = 0;
                        }

                        // --- 6. 蠕滑/滑走率 計算 ---
                        let newSlip = 0;
                        if (newSpeed > 0.1) {
                            if (newWheelSpeed >= newSpeed) {
                                // 牽引空轉比 (正值)
                                newSlip = ((newWheelSpeed - newSpeed) / newWheelSpeed) * 100;
                            } else {
                                // 制動滑走比 (負值)
                                newSlip = ((newWheelSpeed - newSpeed) / newSpeed) * 100;
                            }
                        } else if (newWheelSpeed > 0.1 && newSpeed <= 0.1) {
                            newSlip = 100; // 靜止時車輪原地空轉
                        }

                        // 更新狀態
                        setState(prev => ({
                            ...prev,
                            speed: newSpeed,
                            wheelSpeed: newWheelSpeed,
                            slipRatio: newSlip,
                            distance: prev.distance + (newSpeed / 3.6) * DT,
                            sandLevel: newSandLevel,
                            sanding: prev.sanding && newSandLevel > 0
                        }));

                        setHistory(prev => {
                            const newPoint = { speed: newSpeed, wheelSpeed: newWheelSpeed };
                            const newArr = [...prev, newPoint];
                            if (newArr.length > 100) newArr.shift();
                            return newArr;
                        });

                    }, 50);
                }
                return () => clearInterval(interval);
            }, [env.isRunning]);

            return { state, setState, env, setEnv, history };
        };

                                         </div>

                                         {/* Gradient Slider */}
                                         <div className="mb-1">
                                            <div className="flex justify-between items-end mb-1.5">
                                                <label className="text-[10px] sm:text-xs font-bold text-slate-400 flex items-center gap-1">
                                                    <IconTrendingUp className="w-3 h-3 text-emerald-500" /> 線路坡度 (Gradient)
                                                </label>
                                                <span className="text-xs sm:text-sm font-mono text-white font-bold">{env.gradient > 0 ? `+${env.gradient}` : env.gradient}%</span>
                                            </div>
                                            <input 
                                                type="range" min="-2" max="5" step="0.5"
                                                value={env.gradient}
                                                onChange={(e) => updateEnv('gradient', Number(e.target.value))}
                                                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                                            />
                                            <div className="flex justify-between text-[9px] sm:text-[10px] text-slate-500 mt-1 font-mono">
                                                <span>-2% (下坡)</span>
                                                <span>平地 (0%)</span>
                                                <span>+5% (陡坡)</span>
                                            </div>
                                         </div>
                                    </div>

                                    {/* Sander Control */}
                                    <div className="bg-slate-900 rounded-3xl p-4 sm:p-5 border border-slate-800 shadow-2xl flex items-center gap-3">
                                         <button
                                            onMouseDown={() => updateState('sanding', true)}
                                            onMouseUp={() => updateState('sanding', false)}
                                            onMouseLeave={() => updateState('sanding', false)}
                                            onTouchStart={() => updateState('sanding', true)}
                                            onTouchEnd={() => updateState('sanding', false)}
                                            disabled={state.sandLevel <= 0 || !env.isRunning}
                                            className={`flex-1 py-3.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${
                                                state.sanding 
                                                ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-[0_0_20px_rgba(245,158,11,0.6)] scale-98' 
                                                : 'bg-slate-800 text-slate-200 hover:bg-slate-700'
                                            } disabled:opacity-40 disabled:cursor-not-allowed`}
                                         >
                                            <IconDisc className={`w-5 h-5 mb-1 ${state.sanding ? 'animate-spin' : ''}`} />
                                            <span className="text-[10px] sm:text-xs tracking-wider font-bold">撒砂增加黏著 (SAND)</span>
                                         </button>
                                         <div className="w-20">
                                            <div className="text-[8px] sm:text-[9px] text-slate-500 mb-0.5 text-center font-mono">砂箱餘量</div>
                                            <div className="h-8 w-full bg-slate-950 rounded-lg border border-slate-800 relative overflow-hidden">
                                                <div 
                                                    className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-amber-600 to-amber-400 transition-all duration-300"
                                                    style={{ height: `${state.sandLevel}%` }}
                                                />
                                                <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent pointer-events-none" />
                                            </div>
                                            <div className="text-center text-[10px] sm:text-xs font-mono mt-0.5 text-amber-500 font-bold">{Math.round(state.sandLevel)}%</div>
                                            {state.sandLevel < 100 && (
                                                <button 
                                                    onClick={() => updateState('sandLevel', 100)}
                                                    className="w-full mt-1 text-[8px] sm:text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-300 py-1 rounded"
                                                >
                                                   裝填砂箱
                                                </button>
                                            )}
                                         </div>
                                    </div>

                                </div>

                                {/* RIGHT COLUMN: Visuals & Data (8 cols) */}
                                <div className="lg:col-span-8 space-y-4 sm:space-y-6">
                                    
                                    {/* Immersive Train Body - 手機上縮減為 h-44 */}
                                    <div className="bg-slate-950 rounded-3xl overflow-hidden relative h-44 sm:h-60 lg:h-72 border-2 border-slate-800 shadow-2xl">
                                         <div 
                                            className="absolute inset-0 opacity-25 transition-colors duration-1000"
                                            style={{
                                                backgroundColor: env.weather === 'dry' ? '#070b19' : env.weather === 'wet' ? '#08172c' : '#111827',
                                                backgroundImage: `
                                                    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                                                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)
                                                `,
                                                backgroundSize: '30px 30px'
                                            }}
                                         >
                                             {env.weather === 'wet' && (
                                                 <div className="absolute inset-0 bg-repeat bg-center opacity-45 animate-[pulse_1.2s_infinite]"
                                                      style={{ backgroundImage: 'radial-gradient(circle, #fff 1.2px, transparent 1.2px)', backgroundSize: '16px 32px' }}></div>
                                             )}
                                             {env.weather === 'ice' && (
                                                 <div className="absolute inset-0 bg-gradient-to-b from-teal-500/10 to-transparent pointer-events-none" />
                                             )}
                                         </div>

                                         {/* Moving Track */}
                                         <div className="absolute bottom-0 w-full h-24 bg-gradient-to-b from-slate-900 to-slate-950 border-t-2 border-slate-800">
                                             <div className="absolute -top-1 w-full h-1 bg-slate-700 opacity-60"></div>
                                             <div 
                                                className="h-3 bg-slate-800 w-full mt-1 opacity-95"
                                                style={{
                                                    backgroundImage: 'linear-gradient(90deg, #1e293b 25%, transparent 25%)',
                                                    backgroundSize: '80px 100%',
                                                    animation: state.speed > 0 ? `railMove ${800 / Math.max(state.speed, 1)}ms linear infinite` : 'none'
                                                }}
                                             />
                                             <div className="absolute top-4 w-full h-2.5 bg-gradient-to-r from-slate-300 via-slate-100 to-slate-400 border-b border-slate-600 shadow-lg"></div>
                                         </div>
                                         
                                         {/* High Accuracy Train Body */}
                                         <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[340px] h-[160px] z-10">
                                              <div className="absolute top-0 w-full h-[95px] bg-gradient-to-b from-slate-800 via-slate-700 to-slate-900 rounded-2xl border-b-[6px] border-slate-950 shadow-2xl">
                                                   <div className="absolute top-4 left-6 right-16 h-8 flex gap-3">
                                                        <div className="w-16 h-full bg-slate-950/80 rounded-md border border-slate-600/50 flex items-center justify-center">
                                                             <div className="w-14 h-4 bg-amber-500/10 rounded"></div>
                                                        </div>
                                                        <div className="w-16 h-full bg-slate-950/80 rounded-md border border-slate-600/50 flex items-center justify-center">
                                                             <div className="w-14 h-4 bg-amber-500/10 rounded"></div>
                                                        </div>
                                                        <div className="w-16 h-full bg-slate-950/80 rounded-md border border-slate-600/50 flex items-center justify-center">
                                                             <div className="w-14 h-4 bg-amber-500/10 rounded"></div>
                                                        </div>
                                                   </div>

                                                   <div className="absolute top-3 right-2 w-14 h-10 bg-slate-950 rounded-l-full border border-slate-600/40 overflow-hidden">
                                                        <div className="w-full h-full bg-cyan-950/30"></div>
                                                   </div>

                                                   {env.isRunning && (
                                                       <>
                                                           <div className="absolute bottom-4 right-1 w-3.5 h-3.5 bg-yellow-300 rounded-full shadow-[0_0_15px_#fde047] z-20"></div>
                                                           <div 
                                                             className="absolute bottom-0 -right-28 w-28 h-12 bg-gradient-to-r from-yellow-300/40 via-yellow-300/10 to-transparent pointer-events-none"
                                                             style={{ clipPath: 'polygon(0 40%, 100% 0, 100% 100%, 0 60%)' }}
                                                           />
                                                       </>
                                                   )}

                                                   <div className="absolute top-2 left-3 w-5 h-[87px] bg-slate-900/50 border-r border-slate-950"></div>
                                              </div>

                                              {/* Bogie Frame */}
                                              <div className="absolute bottom-4 left-10 right-10 h-6 bg-slate-900 border-2 border-slate-800 rounded-md shadow-inner flex justify-around">
                                                   <div className="absolute -top-3 left-16 w-8 h-4 flex flex-col justify-between">
                                                        <div className="h-1 bg-slate-600 rounded"></div>
                                                        <div className="h-2.5 bg-gradient-to-r from-slate-400 to-slate-500 border border-slate-700 rounded-sm"></div>
                                                   </div>
                                                   <div className="absolute -top-3 right-16 w-8 h-4 flex flex-col justify-between">
                                                        <div className="h-1 bg-slate-600 rounded"></div>
                                                        <div className="h-2.5 bg-gradient-to-r from-slate-400 to-slate-500 border border-slate-700 rounded-sm"></div>
                                                   </div>
                                              </div>

                                              {/* Wheel Set 1 */}
                                              <div className="absolute -bottom-3 left-14 w-[54px] h-[54px] z-20">
                                                   <div 
                                                       className="w-full h-full rounded-full border-[6px] border-slate-400 bg-slate-950 flex items-center justify-center shadow-xl"
                                                       style={{ 
                                                           transform: `rotate(${(state.distance * 200) % 360}deg)`,
                                                           transition: 'transform 50ms linear',
                                                           animation: state.wheelSpeed > 0 && env.isRunning ? `spinWheel ${2000 / Math.max(state.wheelSpeed, 0.1)}ms linear infinite` : 'none'
                                                       }}
                                                   >
                                                        <div className="w-10 h-10 rounded-full border-4 border-dashed border-slate-600 opacity-60"></div>
                                                        <div className="absolute w-full h-1 bg-slate-800/80"></div>
                                                        <div className="absolute w-1 h-full bg-slate-800/80"></div>
                                                        <div className="w-4 h-4 bg-slate-600 rounded-full border border-slate-400 shadow-lg"></div>
                                                   </div>
                                              </div>

                                              {/* Wheel Set 2 */}
                                              <div className="absolute -bottom-3 right-14 w-[54px] h-[54px] z-20">
                                                   <div 
                                                       className="w-full h-full rounded-full border-[6px] border-slate-400 bg-slate-950 flex items-center justify-center shadow-xl"
                                                       style={{ 
                                                           transform: `rotate(${(state.distance * 200) % 360}deg)`,
                                                           transition: 'transform 50ms linear',
                                                           animation: state.wheelSpeed > 0 && env.isRunning ? `spinWheel ${2000 / Math.max(state.wheelSpeed, 0.1)}ms linear infinite` : 'none'
                                                       }}
                                                   >
                                                        <div className="w-10 h-10 rounded-full border-4 border-dashed border-slate-600 opacity-60"></div>
                                                        <div className="absolute w-full h-1 bg-slate-800/80"></div>
                                                        <div className="absolute w-1 h-full bg-slate-800/80"></div>
                                                        <div className="w-4 h-4 bg-slate-600 rounded-full border border-slate-400 shadow-lg"></div>
                                                   </div>
                                              </div>

                                              {/* Sand Pipe */}
                                              <div className="absolute bottom-5 left-10 w-2 h-7 bg-slate-800 border-r border-slate-950 rounded-full origin-top transform -rotate-12"></div>
                                              {state.sanding && (
                                                  <>
                                                      <div className="absolute -bottom-2.5 left-10 w-4 h-[18px] bg-amber-400/30 blur-[2px] rounded-full animate-pulse" />
                                                      <div className="absolute -bottom-3 left-9 w-6 h-1 bg-amber-500/80 blur-xs animate-bounce" />
                                                  </>
                                              )}

                                              {/* 空轉打滑金色粒子火花 */}
                                              {state.slipRatio > 10 && (
                                                  <div className="absolute -bottom-3 left-14 z-30">
                                                       <div className="w-14 h-14 bg-yellow-400/20 rounded-full blur-xl animate-ping"></div>
                                                       <div className="absolute -left-7 top-1.5 w-2.5 h-2.5 bg-yellow-300 rounded-full animate-[pulse_0.08s_infinite] shadow-[0_0_12px_#facc15]" />
                                                       <div className="absolute -left-4 -top-3 w-1.5 h-1.5 bg-amber-400 rounded-full animate-bounce shadow-[0_0_12px_#f59e0b]" />
                                                       <div className="absolute -left-12 top-4.5 w-2.5 h-2.5 bg-orange-500 rounded-full animate-ping" />
                                                       <div className="absolute -left-10 -top-4 w-1.5 h-1.5 bg-yellow-300 rounded-full animate-pulse" />
                                                  </div>
                                              )}
                                              
                                              {/* 滑走鎖死摩擦灰色白煙 */}
                                              {state.slipRatio < -10 && (
                                                  <div className="absolute -bottom-3 left-14 z-30 pointer-events-none">
                                                       <div className="absolute -left-10 -top-5 w-16 h-12 bg-slate-200/50 rounded-full blur-md animate-[pulse_0.08s_infinite]" />
                                                       <div className="absolute -left-16 -top-8 w-20 h-14 bg-slate-400/30 rounded-full blur-lg animate-ping" />
                                                  </div>
                                              )}
                                         </div>

                                         {/* HUD Overlay (手機上適當縮小邊距與字重) */}
                                         <div className="absolute top-2.5 left-2.5 right-2.5 flex justify-between items-start pointer-events-none">
                                              <div className="bg-slate-900/95 backdrop-blur-md p-2.5 rounded-2xl border border-slate-800 shadow-2xl">
                                                  <div className="text-slate-500 text-[8px] sm:text-[10px] uppercase tracking-widest font-mono font-bold">實際車速</div>
                                                  <div className="text-lg sm:text-2xl font-mono text-white font-black">{state.speed.toFixed(1)} <span className="text-[10px] sm:text-xs text-slate-400 font-normal">km/h</span></div>
                                              </div>
                                              
                                              {state.slipRatio > 10 && (
                                                  <div className="bg-rose-600/95 text-white px-3 sm:px-5 py-1.5 sm:py-2.5 rounded-xl sm:rounded-2xl animate-pulse text-[10px] sm:text-sm font-black shadow-2xl shadow-rose-950/75 flex items-center gap-1.5 border border-rose-400/40">
                                                     <IconAlertTriangle className="w-4 h-4 sm:w-5 sm:h-5 text-white" />
                                                     WHEEL SLIP
                                                  </div>
                                              )}

                                              {state.slipRatio < -10 && (
                                                  <div className="bg-amber-500/95 text-slate-950 px-3 sm:px-5 py-1.5 sm:py-2.5 rounded-xl sm:rounded-2xl animate-pulse text-[10px] sm:text-sm font-black shadow-2xl shadow-amber-950/75 flex items-center gap-1.5 border border-amber-300/40">
                                                     <IconAlertTriangle className="w-4 h-4 sm:w-5 sm:h-5 text-slate-950" />
                                                     WHEEL SLIDE
                                                  </div>
                                              )}
                                              
                                              <div className="bg-slate-900/95 backdrop-blur-md p-2.5 rounded-2xl border border-slate-800 text-right shadow-2xl">
                                                  <div className="text-slate-500 text-[8px] sm:text-[10px] uppercase tracking-widest font-mono font-bold">滑移率 (Slip/Slide)</div>
                                                  <div className={`text-lg sm:text-2xl font-mono font-black ${getAdhesionColor()}`}>
                                                    {state.slipRatio > 0 ? '+' : ''}{state.slipRatio.toFixed(1)} <span className="text-[10px] sm:text-xs font-normal">%</span>
                                                  </div>
                                              </div>
                                         </div>
                                    </div>
                                </div>

                                {/* Graphs (高清晰度示波器) */}
                                <div className="lg:col-span-8 space-y-4 sm:space-y-6">
                                    <div className="bg-slate-900 rounded-3xl p-1 shadow-2xl border border-slate-800 overflow-hidden md:col-span-2">
                                        <div className="bg-slate-950 px-4 py-2.5 border-b border-slate-800 flex justify-between items-center">
                                            <h3 className="text-slate-300 font-bold text-[10px] sm:text-xs font-mono uppercase tracking-widest flex items-center gap-2">
                                               <IconActivity className="w-4 h-4 text-blue-500 animate-pulse" />
                                                車速與轉速動態對比遙測 (Rolling Telemetry)
                                            </h3>
                                        </div>
                                        <div className="p-3 sm:p-4">
                                            <TimeSeriesChart dataHistory={history} />
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-4 sm:gap-6">
                                        <div className="bg-slate-900 rounded-3xl p-4 sm:p-5 border border-slate-800 shadow-2xl flex flex-col justify-between">
                                             <div>
                                                <h3 className="text-slate-400 font-bold text-[10px] sm:text-xs uppercase mb-2 flex items-center gap-1.5 font-mono tracking-widest">
                                                   <IconTrendingUp className="w-4 h-4 text-emerald-500" />
                                                   對稱式黏著控制特性曲線
                                                </h3>
                                                <p className="text-[11px] sm:text-xs text-slate-400 mb-3 leading-relaxed">
                                                   右半邊為牽引加速，左半邊為煞車制動。當代表目前狀態的綠點越過左右「最佳黏著區」頂點後，黏著力就會大幅下滑，車體與車輪產生解聯打滑。
                                                </p>
                                             </div>
                                             <AdhesionGraph currentSlip={state.slipRatio} weather={env.weather} />
                                        </div>

                                        <div className="bg-slate-900 rounded-3xl p-4 sm:p-5 border border-slate-800 shadow-2xl flex flex-col justify-between">
                                            <div>
                                                <h3 className="text-blue-400 font-bold text-[10px] sm:text-xs uppercase mb-2.5 flex items-center gap-1.5 font-mono tracking-widest">
                                                   <IconBookOpen className="w-4 h-4" /> 
                                                   實踐教學任務 (Mission Guidelines)
                                                </h3>
                                                <ul className="text-[11px] sm:text-xs text-slate-300 space-y-3 list-disc pl-4 leading-relaxed">
                                                   <li>
                                                        <strong className="text-white">任務一 (雨天空轉試驗)：</strong> 天氣設為「潮濕」，關閉防滑保護，手柄拉到 P5 (+100%)。
                                                        <span className="block text-sky-400 font-mono mt-0.5 font-bold">觀察：輪速迅速飆高，車輪在濕軌上發生劇烈空轉。</span>
                                                   </li>
                                                   <li>
                                                        <strong className="text-white">任務二 (結冰鎖死試驗)：</strong> 速度超 80 km/h 時，天氣設為「結冰」，關閉保護，手把拉到 EMG (-100%)。
                                                        <span className="block text-amber-400 font-mono mt-0.5 font-bold">觀察：車輪鎖死打滑（0 km/h），但車身因慣性滑行噴煙。</span>
                                                   </li>
                                                   <li>
                                                        <strong className="text-white">任務三 (防滑對比試驗)：</strong> 開啟系統 (ON) 並重現任務，觀察 TC 與 WSP 自動調控以避免空轉及擦傷。
                                                   </li>
                                                </ul>
                                            </div>
                                            <div className="mt-4 p-2.5 bg-slate-950 rounded-xl border border-slate-850/60 flex items-center gap-2.5">
                                                 <div className="bg-blue-900/30 p-1.5 rounded-lg">
                                                      <IconInfo className="w-4 h-4 text-blue-400" />
                                                 </div>
                                                 <p className="text-[9px] sm:text-[10px] text-slate-400 leading-relaxed font-mono">
                                                     車輪滑走保護閥作動響應時間：20ms / 煞車氣壓洩壓率：90%。
                                                 </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    <style>{`
                        @keyframes railMove {
                            from { background-position: 0 0; }
                            to { background-position: -80px 0; }
                        }
                        @keyframes spinWheel {
                            from { transform: rotate(0deg); }
                            to { transform: rotate(360deg); }
                        }
                    `}</style>
                </div>
            );
        }

        // 渲染 React 應用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
